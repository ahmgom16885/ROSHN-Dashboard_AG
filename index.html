     no external icon package. This is the most compatible way to run React
     from a plain double-clicked local file. -->

<script>
// ---------------------------------------------------------------------------
// STORAGE LAYER
// - Personal data (identity, this-device's PIN/access verification) stays in
//   this browser's localStorage, same as before — it's meant to be per-device.
// - Shared data (projects, team, tasks, messages, access code) now syncs
//   through a real Firebase Realtime Database, so every teammate who opens
//   this file sees and updates the SAME live data.
// ---------------------------------------------------------------------------
(function () {
  var FIREBASE_DB_URL = "https://roshn-projects--dashboard-default-rtdb.europe-west1.firebasedatabase.app";

  function localKey(key) {
    return "roshn-local:personal:" + key;
  }
  function fbUrl(key) {
    return FIREBASE_DB_URL + "/shared/" + encodeURIComponent(key) + ".json";
  }

  window.storage = {
    get: function (key, shared) {
      if (!shared) {
        var raw = localStorage.getItem(localKey(key));
        return Promise.resolve(raw === null ? null : { key: key, value: raw, shared: false });
      }
      return fetch(fbUrl(key))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data === null || data === undefined) return null;
          return { key: key, value: data, shared: true };
        });
    },
    set: function (key, value, shared) {
      if (!shared) {
        localStorage.setItem(localKey(key), value);
        return Promise.resolve({ key: key, value: value, shared: false });
      }
      return fetch(fbUrl(key), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(value),
      }).then(function () {
        return { key: key, value: value, shared: true };
      });
    },
    "delete": function (key, shared) {
      if (!shared) {
        localStorage.removeItem(localKey(key));
        return Promise.resolve({ key: key, deleted: true, shared: false });
      }
      return fetch(fbUrl(key), { method: "DELETE" }).then(function () {
        return { key: key, deleted: true, shared: true };
      });
    },
    list: function (prefix, shared) {
      // Not used by this app, kept only so window.storage matches the full API shape.
      return Promise.resolve({ keys: [], prefix: prefix || undefined, shared: !!shared });
    },
  };
  window.FIREBASE_DB_URL = FIREBASE_DB_URL;
})();

window.addEventListener("error", function (e) {
  var root = document.getElementById("root");
  if (root && root.textContent.indexOf("Loading") !== -1) {
    root.innerHTML =
      '<div style="max-width:520px;margin:60px auto;padding:20px;font-family:sans-serif;' +
      'background:#FBE9E7;border:1px solid #E57373;border-radius:8px;color:#7A1F1F;">' +
      '<b>Something failed to load.</b><br/>This page needs an internet connection the first ' +
      'time you open it (to load React from unpkg.com), even though the file itself is local. ' +
      'If you have internet and still see this, try Chrome or Edge, or tell Claude the exact ' +
      "error text from here: " + (e.message || "unknown error") + "</div>";
  }
});
</script>

function App() {
  const [identity, setIdentity] = useState(null);
  const [identityLoading, setIdentityLoading] = useState(true);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("overview");
  const [taskFilter, setTaskFilter] = useState({ project: "all", assignee: "all" });
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const [notifications, setNotifications] = useState([]);
  const [notifOpen, setNotifOpen] = useState(false);
  const [accessVerified, setAccessVerified] = useState(false);
  const [accessChecked, setAccessChecked] = useState(false);
  const [access, setAccess] = useState(undefined); // undefined = not loaded yet, null = no code set
  const [showSettings, setShowSettings] = useState(false);
  const [soundOn, setSoundOn] = useState(true);
  const [lang, setLang] = useState("en");
  const pollRef = useRef(null);
  const audioCtxRef = useRef(null);
  const seenMessageIdsRef = useRef(null); // null = not initialized yet (first load)
  const seenTaskAssignRef = useRef(null); // null = not initialized yet (first load)
  const notifiedOverdueRef = useRef(new Set());

  // reset "already seen" tracking whenever who's logged in changes (login, logout,
  // or switching accounts in the same browser) — otherwise a message sent while
  // logged in as someone else gets wrongly marked "seen" for the next account too
  useEffect(() => {
    seenMessageIdsRef.current = null;
    seenTaskAssignRef.current = null;
    notifiedOverdueRef.current = new Set();
  }, [identity && identity.id]);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(LANG_KEY, false);
        if (res && res.value) setLang(res.value);
      } catch (e) {}
    })();
  }, []);
  const toggleLang = () => {
    setLang((prev) => {
      const next = prev === "en" ? "ar" : "en";
      window.storage.set(LANG_KEY, next, false).catch(() => {});
      return next;
    });
  };
  const t = (key) => (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
  const dir = lang === "ar" ? "rtl" : "ltr";

  // ---- notification center (personal, per-device — never shared) ----
  useEffect(() => {
    if (!identity) return;
    (async () => {
      try {
        const res = await window.storage.get(NOTIF_KEY, false);
        if (res && res.value) setNotifications(JSON.parse(res.value));
      } catch (e) {}
    })();
  }, [identity && identity.id]);

  const persistNotifications = (next) => {
    setNotifications(next);
    window.storage.set(NOTIF_KEY, JSON.stringify(next), false).catch(() => {});
  };
  const pushNotification = (entry) => {
    setNotifications((cur) => {
      const next = [{ id: uid(), read: false, createdAt: now(), ...entry }, ...cur].slice(0, MAX_NOTIFS);
      window.storage.set(NOTIF_KEY, JSON.stringify(next), false).catch(() => {});
      return next;
    });
  };
  const markAllNotificationsRead = () => {
    persistNotifications(notifications.map((n) => ({ ...n, read: true })));
  };
  const unreadNotifCount = notifications.filter((n) => !n.read).length;

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  };

  // ---- notification sound engine (no audio files — simple generated tones) ----
  const ensureAudioCtx = () => {
    if (!audioCtxRef.current) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtxRef.current = new Ctx();
      } catch (e) {}
    } else if (audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume().catch(() => {});
    }
    return audioCtxRef.current;
  };
  const playTone = (freq, duration, delay) => {
    if (!soundOn) return;
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(0.16, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  };
  const playSent = () => playTone(700, 0.09);
  const playReceived = () => { playTone(523, 0.1); playTone(784, 0.14, 0.09); };

  // ---- load sound preference (per device) ----
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(SOUND_KEY, false);
        if (res && res.value != null) setSoundOn(res.value !== "off");
      } catch (e) {}
    })();
  }, []);
  const toggleSound = () => {
    setSoundOn((prev) => {
      const next = !prev;
      window.storage.set(SOUND_KEY, next ? "on" : "off", false).catch(() => {});
      return next;
    });
  };

  // ---- play a notification tone when a NEW message from someone else arrives ----
  useEffect(() => {
    if (!data || !identity) return;
    const ids = new Set(data.messages.map((m) => m.id));
    if (seenMessageIdsRef.current === null) {
      // first load — just remember what's already there, don't play anything
      seenMessageIdsRef.current = ids;
      return;
    }
    const newOnes = data.messages.filter((m) => !seenMessageIdsRef.current.has(m.id) && m.authorId !== identity.id);
    seenMessageIdsRef.current = ids;
    if (newOnes.length > 0) {
      playReceived();
      newOnes.forEach((m) => {
        const author = data.team.find((t) => t.id === m.authorId);
        const authorName = author ? author.name : "Someone";
        const isMention = m.mentions && m.mentions.includes(identity.id);
        const proj = m.projectId ? data.projects.find((p) => p.id === m.projectId) : null;
        pushNotification({
          type: isMention ? "mention" : "message",
          text: isMention ? `${authorName} mentioned you` : `${authorName}: ${m.text || (m.attachment ? "sent a file" : "")}`,
          channelLabel: proj ? `${proj.code} · ${proj.name}` : "General",
        });
        if (isMention) showToast(`${authorName} mentioned you`);
      });
    }
  }, [data && data.messages, identity]);

  // ---- notify when a task is newly assigned to you ----
  useEffect(() => {
    if (!data || !identity) return;
    const currentMap = {};
    data.tasks.forEach((tsk) => { currentMap[tsk.id] = tsk.assigneeId; });
    if (seenTaskAssignRef.current === null) {
      seenTaskAssignRef.current = currentMap;
      return;
    }
    const prevMap = seenTaskAssignRef.current;
    data.tasks.forEach((tsk) => {
      if (tsk.assigneeId === identity.id && prevMap[tsk.id] !== identity.id) {
        const proj = data.projects.find((p) => p.id === tsk.projectId);
        pushNotification({
          type: "task",
          text: `You were assigned "${tsk.title}"`,
          channelLabel: proj ? `${proj.code} · ${proj.name}` : "",
        });
      }
    });
    seenTaskAssignRef.current = currentMap;
  }, [data && data.tasks, identity]);

  // ---- notify when one of your tasks is overdue (once per task per session) ----
  useEffect(() => {
    if (!data || !identity) return;
    data.tasks.forEach((tsk) => {
      const isOverdue = tsk.dueDate && tsk.status !== "done" && new Date(tsk.dueDate) < new Date();
      if (tsk.assigneeId === identity.id && isOverdue && !notifiedOverdueRef.current.has(tsk.id)) {
        notifiedOverdueRef.current.add(tsk.id);
        const proj = data.projects.find((p) => p.id === tsk.projectId);
        pushNotification({
          type: "overdue",
          text: `"${tsk.title}" is overdue`,
          channelLabel: proj ? `${proj.code} · ${proj.name}` : "",
        });
      }
    });
  }, [data && data.tasks, identity]);

  // ---- presence: heartbeat so others can see you're online ----
  useEffect(() => {
    if (!identity || !window.FIREBASE_DB_URL) return;
    const beat = () => {
      fetch(window.FIREBASE_DB_URL + "/shared/presence/" + identity.id + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(new Date().toISOString()),
      }).catch(() => {});
    };
    beat();
    const t = setInterval(beat, 25000);
    return () => clearInterval(t);
  }, [identity]);

  const [presence, setPresence] = useState({});
  useEffect(() => {
    if (!window.FIREBASE_DB_URL) return;
    const load = () => {
      fetch(window.FIREBASE_DB_URL + "/shared/presence.json")
        .then((r) => r.json())
        .then((d) => setPresence(d || {}))
        .catch(() => {});
    };
    load();
    const t = setInterval(load, 20000);
    return () => clearInterval(t);
  }, []);

  // ---- configurable call link (admin sets once, e.g. a Google Meet link) ----
  const [callLink, setCallLink] = useState(undefined);
  const loadCallLink = useCallback(async () => {
    try {
      const res = await window.storage.get(CALL_LINK_KEY, true);
      setCallLink(res && res.value ? res.value : null);
    } catch (e) {
      setCallLink(null);
    }
  }, []);
  useEffect(() => { loadCallLink(); }, [loadCallLink]);
  const persistCallLink = async (link) => {
    setCallLink(link);
    try {
      await window.storage.set(CALL_LINK_KEY, link, true);
    } catch (e) {
      showToast("Could not save the call link — check your connection.");
    }
  };

  // ---- active call alert: poll frequently, show a join banner for ~90s ----
  const [activeCall, setActiveCall] = useState(null);
  const [dismissedCallAt, setDismissedCallAt] = useState(null);
  const seenCallRef = useRef(null);
  useEffect(() => {
    const poll = async () => {
      try {
        const res = await window.storage.get(ACTIVE_CALL_KEY, true);
        const call = res && res.value ? JSON.parse(res.value) : null;
        setActiveCall(call);
        if (call && identity && call.startedBy !== identity.id && seenCallRef.current !== call.startedAt) {
          seenCallRef.current = call.startedAt;
          playReceived();
          if (window.Notification && Notification.permission === "granted") {
            try { new Notification("Incoming call — ROSHN Dashboard", { body: (call.byName || "Someone") + " started a call" }); } catch (e) {}
          }
        }
      } catch (e) {}
    };
    poll();
    const t = setInterval(poll, 8000);
    return () => clearInterval(t);
  }, [identity]);

  const startCall = async (channelLabel) => {
    if (!callLink) {
      showToast("No call link set yet — the admin needs to add one in Settings first.");
      return;
    }
    window.open(callLink, "_blank", "noopener,noreferrer");
    try {
      await window.storage.set(ACTIVE_CALL_KEY, JSON.stringify({
        startedBy: identity.id, byName: identity.name, channel: channelLabel, startedAt: now(), link: callLink,
      }), true);
    } catch (e) {}
  };

  const showActiveCallBanner =
    activeCall && identity && activeCall.startedBy !== identity.id &&
    (Date.now() - new Date(activeCall.startedAt).getTime()) < 90000 &&
    dismissedCallAt !== activeCall.startedAt;

  // ================= Native 1-to-1 WebRTC calling (no third-party service) =================
  const [incomingCall, setIncomingCall] = useState(null); // { callId, callerId, callerName }
  const [callPhase, setCallPhase] = useState("idle"); // idle | outgoing | active
  const [callPeerName, setCallPeerName] = useState("");
  const [micOn, setMicOn] = useState(true);
  const [camOn, setCamOn] = useState(true);
  const [localHasVideo, setLocalHasVideo] = useState(true);
  const [remoteHasVideo, setRemoteHasVideo] = useState(false);
  const [sharingScreen, setSharingScreen] = useState(false);
  const screenStreamRef = useRef(null);
  const cameraVideoTrackRef = useRef(null);
  const [callError, setCallError] = useState("");
  const [callDiag, setCallDiag] = useState("");
  const [audioBlocked, setAudioBlocked] = useState(false);
  const localVideoRef = useRef(null);
  const remoteVideoRef = useRef(null);
  const remoteAudioRef = useRef(null);
  const pcRef = useRef(null);
  const localStreamRef = useRef(null);
  const currentCallIdRef = useRef(null);
  const incomingCallRef = useRef(null);
  const myCandCountRef = useRef(0);
  const appliedTheirCandCountRef = useRef(0);
  const callDocEsRef = useRef(null);
  const ringIntervalRef = useRef(null);

  const startRing = () => {
    stopRing();
    playTone(660, 0.3);
    ringIntervalRef.current = setInterval(() => playTone(660, 0.3), 1500);
  };
  const stopRing = () => {
    if (ringIntervalRef.current) { clearInterval(ringIntervalRef.current); ringIntervalRef.current = null; }
  };

  const cleanupCall = () => {
    stopRing();
    if (pcRef.current) { try { pcRef.current.close(); } catch (e) {} pcRef.current = null; }
    if (localStreamRef.current) { localStreamRef.current.getTracks().forEach((t) => t.stop()); localStreamRef.current = null; }
    if (screenStreamRef.current) { screenStreamRef.current.getTracks().forEach((t) => t.stop()); screenStreamRef.current = null; }
    if (callDocEsRef.current) { callDocEsRef.current.close(); callDocEsRef.current = null; }
    currentCallIdRef.current = null;
    myCandCountRef.current = 0;
    appliedTheirCandCountRef.current = 0;
    cameraVideoTrackRef.current = null;
    setCallPhase("idle");
    setCallPeerName("");
    setMicOn(true);
    setCamOn(true);
    setLocalHasVideo(true);
    setRemoteHasVideo(false);
    setSharingScreen(false);
    setAudioBlocked(false);
  };

  const createPeerConnection = (callIdForConn, role) => {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.onicecandidate = (e) => {
      if (!e.candidate) return;
      const field = role === "caller" ? "candidatesCaller" : "candidatesCallee";
      myCandCountRef.current += 1;
      fbSet(`shared/calls/${callIdForConn}/${field}/${myCandCountRef.current}`, e.candidate.toJSON());
    };
    pc.ontrack = (e) => {
      if (e.track.kind === "audio" && remoteAudioRef.current) {
        remoteAudioRef.current.srcObject = e.streams[0];
        remoteAudioRef.current.play().catch(() => {});
      }
      if (e.track.kind === "video" && remoteVideoRef.current) {
        remoteVideoRef.current.srcObject = e.streams[0];
        remoteVideoRef.current.play().catch(() => {});
        setRemoteHasVideo(true);
      }
    };
    return pc;
  };

  const attachLocalStream = async (pc) => {
    let stream;
    let hasVideo = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (e) {
      // no camera found/available on this device — still make the call work, just audio-only
      stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
      hasVideo = false;
    }
    setLocalHasVideo(hasVideo);
    localStreamRef.current = stream;
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    if (localVideoRef.current) {
      localVideoRef.current.srcObject = stream;
      localVideoRef.current.play().catch(() => {});
    }
  };

  const listenToCallDoc = (callIdForConn, role) => {
    if (callDocEsRef.current) callDocEsRef.current.close();
    callDocEsRef.current = fbListen(`shared/calls/${callIdForConn}`, async () => {
      const doc = await fbGet(`shared/calls/${callIdForConn}`);
      if (currentCallIdRef.current !== callIdForConn) return;
      if (!doc || doc.status === "ended" || doc.status === "declined") {
        if (doc && doc.status === "declined") setCallError("Call declined.");
        cleanupCall();
        return;
      }
      const pc = pcRef.current;
      if (!pc) return;
      if (role === "caller" && doc.answer && !pc.currentRemoteDescription) {
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(doc.answer));
          setCallPhase("active");
          stopRing();
        } catch (e) {}
      }
      const theirField = role === "caller" ? "candidatesCallee" : "candidatesCaller";
      const theirCands = doc[theirField];
      if (theirCands) {
        const keys = Object.keys(theirCands).map(Number).sort((a, b) => a - b);
        for (const k of keys) {
          if (k > appliedTheirCandCountRef.current) {
            try { await pc.addIceCandidate(new RTCIceCandidate(theirCands[k])); } catch (e) {}
          }
        }
        if (keys.length) appliedTheirCandCountRef.current = Math.max(...keys);
      }
    });
  };

  const startOneToOneCall = async (targetId, targetName) => {
    if (callPhase !== "idle" || incomingCallRef.current) { showToast("You're already on a call."); return; }
    setCallError("");
    const newCallId = uid();
    currentCallIdRef.current = newCallId;
    setCallPeerName(targetName);
    setCallPhase("outgoing");
    startRing();
    try {
      const pc = createPeerConnection(newCallId, "caller");
      pcRef.current = pc;
      await attachLocalStream(pc);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await fbSet(`shared/calls/${newCallId}`, {
        callerId: identity.id, callerName: identity.name,
        calleeId: targetId, calleeName: targetName,
        offer: { type: offer.type, sdp: offer.sdp },
        status: "ringing", createdAt: now(),
      });
      await fbSet(`shared/callSignals/${targetId}`, { callId: newCallId, callerId: identity.id, callerName: identity.name, createdAt: now() });
      listenToCallDoc(newCallId, "caller");
    } catch (e) {
      setCallError("Couldn't start the call: " + (e && e.message ? e.message : "unknown error") + ".");
      cleanupCall();
    }
  };

  const acceptIncomingCall = async () => {
    if (!incomingCall) return;
    const { callId: incId, callerName } = incomingCall;
    stopRing();
    setIncomingCall(null);
    incomingCallRef.current = null;
    await fbDelete(`shared/callSignals/${identity.id}`);
    currentCallIdRef.current = incId;
    setCallPeerName(callerName);
    setCallPhase("active");
    try {
      const doc = await fbGet(`shared/calls/${incId}`);
      if (!doc || !doc.offer) { setCallError("Call is no longer available."); cleanupCall(); return; }
      const pc = createPeerConnection(incId, "callee");
      pcRef.current = pc;
      await attachLocalStream(pc);
      await pc.setRemoteDescription(new RTCSessionDescription(doc.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await fbSet(`shared/calls/${incId}/answer`, { type: answer.type, sdp: answer.sdp });
      await fbSet(`shared/calls/${incId}/status`, "accepted");
      listenToCallDoc(incId, "callee");
    } catch (e) {
      setCallError("Couldn't join the call: " + (e && e.message ? e.message : "unknown error") + ".");
      cleanupCall();
    }
  };

  const declineIncomingCall = async () => {
    if (!incomingCall) return;
    stopRing();
    const { callId: incId } = incomingCall;
    setIncomingCall(null);
    incomingCallRef.current = null;
    await fbDelete(`shared/callSignals/${identity.id}`);
    await fbSet(`shared/calls/${incId}/status`, "declined");
  };

  const hangUpCall = async () => {
    const endingId = currentCallIdRef.current;
    if (endingId) await fbSet(`shared/calls/${endingId}/status`, "ended");
    cleanupCall();
  };

  const resumeRemoteAudio = () => {
    if (remoteAudioRef.current) {
      remoteAudioRef.current.play().then(() => setAudioBlocked(false)).catch(() => {});
    }
  };

  const toggleMic = () => {
    if (localStreamRef.current) localStreamRef.current.getAudioTracks().forEach((t) => { t.enabled = !micOn; });
    setMicOn((s) => !s);
  };
  const toggleCam = () => {
    if (localStreamRef.current) localStreamRef.current.getVideoTracks().forEach((t) => { t.enabled = !camOn; });
    setCamOn((s) => !s);
  };

  // NOTE: screen sharing was removed for now — it needs proper WebRTC renegotiation
  // to work reliably across browsers, which is a bigger, separate piece of work.

  // cross-browser-safe check for whether the remote video element is actually
  // rendering real frames — more reliable than track mute/unmute events, which
  // Safari/iOS implements inconsistently
  useEffect(() => {
    if (callPhase !== "active") return;
    const iv = setInterval(() => {
      const v = remoteVideoRef.current;
      if (!v) return;
      const hasFrames = v.videoWidth > 0 && v.videoHeight > 0;
      setRemoteHasVideo((prev) => (prev !== hasFrames ? hasFrames : prev));
    }, 700);
    return () => clearInterval(iv);
  }, [callPhase]);

  // on-screen diagnostics — so we can SEE what's actually happening in a call
  // without needing DevTools open
  const lastAudioPacketsRef = useRef(0);
  useEffect(() => {
    if (callPhase !== "active" && callPhase !== "outgoing") { setCallDiag(""); lastAudioPacketsRef.current = 0; return; }
    const iv = setInterval(async () => {
      const pc = pcRef.current;
      if (!pc) { setCallDiag("no peer connection yet"); return; }
      const localAudio = localStreamRef.current ? localStreamRef.current.getAudioTracks()[0] : null;
      const senders = pc.getSenders().map((s) => s.track ? `${s.track.kind}:${s.track.readyState}${s.track.enabled ? "" : ":disabled"}${s.track.muted ? ":muted" : ""}` : "no-track");
      const receivers = pc.getReceivers().map((r) => r.track ? `${r.track.kind}:${r.track.readyState}${r.track.muted ? ":muted" : ""}` : "no-track");
      const audioEl = remoteAudioRef;

      // the definitive check: is real audio DATA actually arriving, not just a track object existing
      let packetsLine = "stats: unavailable";
      try {
        const stats = await pc.getStats(null);
        let found = null;
        stats.forEach((report) => {
          if (report.type === "inbound-rtp" && report.kind === "audio") found = report;
        });
        if (found) {
          const packets = found.packetsReceived || 0;
          const delta = packets - lastAudioPacketsRef.current;
          lastAudioPacketsRef.current = packets;
          const level = found.audioLevel !== undefined ? found.audioLevel.toFixed(3) : "n/a";
          packetsLine = `audio packets in: ${packets} (+${delta}/s) | level: ${level}`;
        } else {
          packetsLine = "audio packets in: no inbound-rtp report yet";
        }
      } catch (e) {
        packetsLine = "stats error: " + e.message;
      }

      const lines = [
        `ICE: ${pc.iceConnectionState} | signaling: ${pc.signalingState}`,
        `local mic: ${localAudio ? (localAudio.enabled ? "enabled" : "disabled") + (localAudio.muted ? " muted" : "") : "none"}`,
        `senders: ${senders.join(", ") || "none"}`,
        `receivers: ${receivers.join(", ") || "none"}`,
        `audio el: ${audioEl && audioEl.current ? `paused=${audioEl.current.paused} muted=${audioEl.current.muted} vol=${audioEl.current.volume}` : "not mounted"}`,
        packetsLine,
      ];
      setCallDiag(lines.join("\n"));
      const hasIncomingAudio = receivers.some((r) => r.startsWith("audio:live"));
      const isPaused = audioEl && audioEl.current && audioEl.current.paused;
      setAudioBlocked(!!(hasIncomingAudio && isPaused));
    }, 1000);
    return () => clearInterval(iv);
  }, [callPhase]);

  // listen for incoming calls addressed to me
  useEffect(() => {
    if (!identity || !window.FIREBASE_DB_URL) return;
    const check = async () => {
      const sig = await fbGet(`shared/callSignals/${identity.id}`);
      if (sig && !currentCallIdRef.current && !incomingCallRef.current) {
        incomingCallRef.current = sig;
        setIncomingCall(sig);
        startRing();
      } else if (!sig && incomingCallRef.current) {
        incomingCallRef.current = null;
        setIncomingCall(null);
        stopRing();
      }
    };
    check();
    const listener = fbListen(`shared/callSignals/${identity.id}`, check);
    return () => listener.close();
  }, [identity]);

  // ---- load identity ----
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(IDENTITY_KEY, false);
        if (res && res.value) setIdentity(JSON.parse(res.value));
      } catch (e) {
        // no identity yet
      }
      setIdentityLoading(false);
    })();
  }, []);

  // ---- load + poll the access code (its own isolated key) ----
  const loadAccess = useCallback(async (silent) => {
    try {
      const res = await window.storage.get(ACCESS_KEY, true);
      setAccess(res && res.value ? JSON.parse(res.value) : null);
    } catch (e) {
      if (!silent) setAccess(null);
    }
  }, []);

  useEffect(() => {
    loadAccess(false);
    const t = setInterval(() => loadAccess(true), 20000);
    return () => clearInterval(t);
  }, [loadAccess]);

  const persistAccess = async (nextAccess) => {
    setAccess(nextAccess);
    try {
      if (nextAccess) {
        await window.storage.set(ACCESS_KEY, JSON.stringify(nextAccess), true);
      } else {
        await window.storage.delete(ACCESS_KEY, true);
      }
    } catch (e) {
      showToast("Could not save — check your connection and try again.");
    }
  };

  // ---- load + poll shared data ----
  const loadData = useCallback(async (silent) => {
    try {
      const res = await window.storage.get(DATA_KEY, true);
      if (res && res.value) {
        setData(JSON.parse(res.value));
      } else if (!silent) {
        setData(emptyState());
      }
    } catch (e) {
      if (!silent) setData(emptyState());
    }
    if (!silent) setLoading(false);
  }, []);

  useEffect(() => {
    loadData(false);
    pollRef.current = setInterval(() => loadData(true), 20000);
    return () => clearInterval(pollRef.current);
  }, [loadData]);

  const lastCheckedCodeRef = useRef(undefined);

  // ---- check whether this device already knows the current access code ----
  useEffect(() => {
    if (access === undefined) return; // not loaded yet
    const currentCode = access && access.code ? access.code : null;
    if (accessChecked && lastCheckedCodeRef.current === currentCode) return;
    lastCheckedCodeRef.current = currentCode;
    (async () => {
      if (!currentCode) {
        setAccessVerified(true);
        setAccessChecked(true);
        return;
      }
      try {
        const res = await window.storage.get(ACCESS_VERIFIED_KEY, false);
        const saved = res && res.value ? JSON.parse(res.value) : null;
        setAccessVerified(!!saved && saved.code === currentCode);
      } catch (e) {
        setAccessVerified(false);
      }
      setAccessChecked(true);
    })();
  }, [access, accessChecked]);

  const unlockAccess = async (code) => {
    if (!access || code !== access.code) return false;
    try {
      await window.storage.set(ACCESS_VERIFIED_KEY, JSON.stringify({ code }), false);
    } catch (e) {}
    setAccessVerified(true);
    return true;
  };

  // fallback for the access-code gate: a valid dashboard login always gets you in,
  // even if you (or the admin) don't know/remember the team access code
  const unlockViaLogin = async (username, password) => {
    const ok = await login(username, password);
    if (ok) {
      setAccessVerified(true);
      try {
        if (access && access.code) await window.storage.set(ACCESS_VERIFIED_KEY, JSON.stringify({ code: access.code }), false);
      } catch (e) {}
    }
    return ok;
  };

  const persist = async (nextData) => {
    setData(nextData);
    setSaving(true);
    try {
      await window.storage.set(DATA_KEY, JSON.stringify(nextData), true);
    } catch (e) {
      showToast("Could not save — check your connection and try again.");
    }
    setSaving(false);
  };

  // ---- backfill: make sure every task's assignee is a member of that task's
  // project channel, including tasks assigned before this feature existed ----
  const backfilledRef = useRef(false);
  useEffect(() => {
    if (!data || !identity || data.adminId !== identity.id) return;
    const needed = {};
    (data.tasks || []).forEach((t) => {
      if (!t.projectId || !t.assigneeId) return;
      const proj = (data.projects || []).find((p) => p.id === t.projectId);
      if (proj && !(proj.memberIds || []).includes(t.assigneeId)) {
        needed[t.projectId] = new Set([...(needed[t.projectId] || proj.memberIds || []), t.assigneeId]);
      }
    });
    if (Object.keys(needed).length === 0) return;
    const sig = Object.keys(needed).sort().join(",");
    if (backfilledRef.current === sig) return; // already tried this exact fix, don't loop
    backfilledRef.current = sig;
    const nextProjects = data.projects.map((p) => (needed[p.id] ? { ...p, memberIds: Array.from(needed[p.id]) } : p));
    persist({ ...data, projects: nextProjects });
  }, [data, identity]);

  // ---- first-ever setup: the very first account created becomes admin ----
  const createAdminAccount = async (person) => {
    try {
      await window.storage.set(IDENTITY_KEY, JSON.stringify(person), false);
    } catch (e) {}
    setIdentity(person);
    let base = null;
    try {
      const res = await window.storage.get(DATA_KEY, true);
      base = res && res.value ? JSON.parse(res.value) : null;
    } catch (e) {}
    base = base || data || emptyState();
    const next = { ...base, team: [...base.team, person], adminId: person.id };
    await persist(next);
  };

  // ---- login with admin-issued username + password ----
  const login = async (identifier, password) => {
    let base = null;
    try {
      const res = await window.storage.get(DATA_KEY, true);
      base = res && res.value ? JSON.parse(res.value) : null;
    } catch (e) {}
    base = base || data || emptyState();
    setData(base);
    const id = identifier.trim().toLowerCase();
    const match = base.team.find(
      (t) =>
        ((t.username || "").toLowerCase() === id || (t.initials || "").toLowerCase() === id) &&
        t.password === password
    );
    if (!match) return false;
    try {
      await window.storage.set(IDENTITY_KEY, JSON.stringify(match), false);
    } catch (e) {}
    setIdentity(match);
    return true;
  };

  // ---- password recovery: email a 6-digit code, then confirm + set new password ----
  const requestPasswordReset = async (identifier) => {
    let base = null;
    try {
      const res = await window.storage.get(DATA_KEY, true);
      base = res && res.value ? JSON.parse(res.value) : null;
    } catch (e) {}
    base = base || data || emptyState();
    const id = identifier.trim().toLowerCase();
    const member = base.team.find(
      (t) => (t.username || "").toLowerCase() === id || (t.initials || "").toLowerCase() === id
    );
    if (!member) return { ok: false, reason: "notfound" };
    if (!member.recoveryEmail) return { ok: false, reason: "noemail" };

    const code = String(Math.floor(100000 + Math.random() * 900000));
    const expiresAt = Date.now() + 15 * 60 * 1000;
    try {
      await fetch(window.FIREBASE_DB_URL + "/shared/passwordResets/" + member.id + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, expiresAt }),
      });
      if (window.emailjs) {
        await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: member.recoveryEmail, to_name: member.name, code: code,
        }, EMAILJS_PUBLIC_KEY);
      }
      return { ok: true, memberId: member.id };
    } catch (e) {
      return { ok: false, reason: "senderror" };
    }
  };

  const confirmPasswordReset = async (identifier, code, newPassword) => {
    let base = null;
    try {
      const res = await window.storage.get(DATA_KEY, true);
      base = res && res.value ? JSON.parse(res.value) : null;
    } catch (e) {}
    base = base || data || emptyState();
    const id = identifier.trim().toLowerCase();
    const member = base.team.find(
      (t) => (t.username || "").toLowerCase() === id || (t.initials || "").toLowerCase() === id
    );
    if (!member) return false;

    let record = null;
    try {
      const res = await fetch(window.FIREBASE_DB_URL + "/shared/passwordResets/" + member.id + ".json");
      record = await res.json();
    } catch (e) {}
    if (!record || record.code !== code.trim() || Date.now() > record.expiresAt) return false;

    const nextTeam = base.team.map((t) => (t.id === member.id ? { ...t, password: newPassword } : t));
    const next = { ...base, team: nextTeam };
    await persist(next);
    try {
      await fetch(window.FIREBASE_DB_URL + "/shared/passwordResets/" + member.id + ".json", { method: "DELETE" });
    } catch (e) {}
    const updatedMember = { ...member, password: newPassword };
    try {
      await window.storage.set(IDENTITY_KEY, JSON.stringify(updatedMember), false);
    } catch (e) {}
    setIdentity(updatedMember);
    return true;
  };

  const logout = async () => {
    try {
      await window.storage.delete(IDENTITY_KEY, false);
    } catch (e) {}
    setIdentity(null);
  };

  // security: if the admin removes this person from the team, kick them out
  // immediately instead of letting their session keep working until they log out
  useEffect(() => {
    if (!data || !identity) return;
    const stillExists = data.team.some(
      (t) => t.id === identity.id || (identity.username && t.username === identity.username) || (identity.initials && t.initials === identity.initials)
    );
    if (!stillExists) {
      showToast("Your account was removed from this team.");
      logout();
    }
  }, [data && data.team, identity]);

  const shareDashboard = async () => {
    const url = window.location.href;
    try {
      if (navigator.share) {
        await navigator.share({ title: "ROSHN Portfolio Dashboard", url });
        return;
      }
    } catch (e) {}
    try {
      await navigator.clipboard.writeText(url);
      showToast("Dashboard link copied — paste it to your team.");
    } catch (e) {
      window.prompt("Copy this link:", url);
    }
  };

  const langValue = { lang, dir, t, toggleLang };

  if (identityLoading || loading || !data || !accessChecked) {
    return (
      <div dir={dir} style={{ background: PAPER, minHeight: "100vh" }} className="flex items-center justify-center">
        <div className="flex flex-col items-center gap-3">
          <div className="w-10 h-10 rounded-full border-4 animate-spin" style={{ borderColor: LINE, borderTopColor: NAVY }} />
          <p style={{ color: INK }} className="text-sm">Loading ROSHN portfolio dashboard…</p>
        </div>
      </div>
    );
  }

  if (access && access.code && !accessVerified) {
    return (
      <LangContext.Provider value={langValue}>
        <AccessGate onUnlock={unlockAccess} onLoginBypass={unlockViaLogin} showToast={showToast} />
      </LangContext.Provider>
    );
  }

  if (!identity) {
    return (
      <LangContext.Provider value={langValue}>
        <IdentityGate hasTeam={data.team.length > 0} onCreateAdmin={createAdminAccount} onLogin={login}
          onRequestReset={requestPasswordReset} onConfirmReset={confirmPasswordReset} />
      </LangContext.Provider>
    );
  }

  return (
    <LangContext.Provider value={langValue}>
    <div dir={dir} style={{ background: PAPER, minHeight: "100vh", color: INK }} className="font-sans">
      <TopBar identity={identity} saving={saving} onRefresh={() => loadData(false)} onOpenSettings={() => setShowSettings(true)}
        soundOn={soundOn} onToggleSound={toggleSound} onLogout={logout} onShare={shareDashboard}
        notifications={notifications} unreadNotifCount={unreadNotifCount} notifOpen={notifOpen} setNotifOpen={setNotifOpen}
        onMarkAllRead={markAllNotificationsRead}
        onOpenNotification={(n) => {
          persistNotifications(notifications.map((x) => (x.id === n.id ? { ...x, read: true } : x)));
          setTab(n.type === "task" ? "tasks" : "messages");
          setNotifOpen(false);
        }}
      />
      {showActiveCallBanner && (
        <div className="sticky top-0 z-50 text-white px-4 py-2.5 flex items-center justify-between gap-3" style={{ background: TEAL }}>
          <div className="flex items-center gap-2 min-w-0">
            <PhoneCall size={16} className="shrink-0 animate-pulse" />
            <p className="text-sm truncate"><span className="font-semibold">{activeCall.byName}</span> started a call{activeCall.channel ? ` in ${activeCall.channel}` : ""}</p>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={() => { window.open(activeCall.link, "_blank", "noopener,noreferrer"); setDismissedCallAt(activeCall.startedAt); }}
              className="text-xs font-semibold px-3 py-1.5 rounded-lg" style={{ background: "white", color: TEAL }}>Join</button>
            <button onClick={() => setDismissedCallAt(activeCall.startedAt)} className="text-white/80 hover:text-white"><X size={16} /></button>
          </div>
        </div>
      )}
      <CallOverlay
        incomingCall={incomingCall} callPhase={callPhase} callPeerName={callPeerName}
        callError={callError} micOn={micOn} camOn={camOn} localHasVideo={localHasVideo} remoteHasVideo={remoteHasVideo}
        callDiag={callDiag} audioBlocked={audioBlocked} onResumeAudio={resumeRemoteAudio}
        localVideoRef={localVideoRef} remoteVideoRef={remoteVideoRef} remoteAudioRef={remoteAudioRef}
        onAccept={acceptIncomingCall} onDecline={declineIncomingCall} onHangUp={hangUpCall}
        onToggleMic={toggleMic} onToggleCam={toggleCam} onDismissError={() => setCallError("")}
      />
      <div className="flex max-w-7xl mx-auto">
        <SideNav tab={tab} setTab={setTab} />
        <main className="flex-1 min-w-0 px-4 md:px-8 py-6">
          {tab === "overview" && (
            <Overview data={data} identity={identity} presence={presence} goTasks={(pid) => { setTaskFilter({ project: pid || "all", assignee: "all" }); setTab("tasks"); }} />
          )}
          {tab === "projects" && (
            <Projects data={data} persist={persist} identity={identity} goTasks={(pid) => { setTaskFilter({ project: pid, assignee: "all" }); setTab("tasks"); }} />
          )}
          {tab === "tasks" && (
            <Tasks data={data} persist={persist} identity={identity} filter={taskFilter} setFilter={setTaskFilter} />
          )}
          {tab === "team" && <Team data={data} persist={persist} identity={identity} presence={presence} onCall={startOneToOneCall} callPhase={callPhase} />}
          {tab === "messages" && <Messages data={data} persist={persist} identity={identity} onSent={playSent} onStartCall={startCall} callLink={callLink} />}
          {tab === "reports" && <Reports data={data} />}
        </main>
      </div>
      {toast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-[60]">
          {toast}
        </div>
      )}
      {showSettings && (
        <SettingsModal data={data} persist={persist} access={access} persistAccess={persistAccess} identity={identity} onClose={() => setShowSettings(false)}
          showToast={showToast} callLink={callLink} persistCallLink={persistCallLink} onShare={shareDashboard} />
      )}
    </div>
    </LangContext.Provider>
  );
}

// ---------------------------------------------------------------------------
// Access gate — optional shared "team code" that locks the whole dashboard
// ---------------------------------------------------------------------------
function AccessGate({ onUnlock, onLoginBypass, showToast }) {
  const { t, dir } = useLang();
  const [code, setCode] = useState("");
  const [error, setError] = useState(false);
  const [checking, setChecking] = useState(false);
  const [showLoginFallback, setShowLoginFallback] = useState(false);
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState(false);

  const submit = async () => {
    if (!code.trim()) return;
    setChecking(true);
    const ok = await onUnlock(code.trim());
    setChecking(false);
    if (!ok) {
      setError(true);
      setCode("");
    }
  };

  const submitLoginBypass = async () => {
    if (!username.trim() || !password.trim()) return;
    setChecking(true);
    const ok = await onLoginBypass(username, password);
    setChecking(false);
    if (!ok) {
      setLoginError(true);
      setPassword("");
    }
  };

  return (
    <div dir={dir} style={{ background: NAVY, minHeight: "100vh" }} className="flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div style={{ background: NAVY_DARK }} className="px-6 py-5">
          <p style={{ color: GOLD }} className="text-xs font-semibold tracking-widest uppercase">RSTMS</p>
          <h1 className="text-white text-lg font-bold mt-1">{t("restrictedAccess")}</h1>
          <p className="text-slate-300 text-sm mt-1">
            {showLoginFallback ? "Log in with your dashboard username and password instead." : t("enterCode")}
          </p>
        </div>
        {!showLoginFallback ? (
          <div className="p-6 space-y-3">
            <div className="flex items-center gap-2 border rounded-lg px-3 py-2" style={{ borderColor: error ? "#B42318" : LINE }}>
              <Lock size={15} className="text-slate-400 shrink-0" />
              <input
                autoFocus
                type="password"
                value={code}
                onChange={(e) => { setCode(e.target.value); setError(false); }}
                onKeyDown={(e) => e.key === "Enter" && submit()}
                placeholder={t("accessCode")}
                className="flex-1 outline-none text-sm"
              />
            </div>
            {error && <p className="text-xs text-red-600">Incorrect code. Check with your project lead.</p>}
            <button onClick={submit} disabled={checking} className="w-full py-2.5 rounded-lg font-medium text-white disabled:opacity-40" style={{ background: NAVY }}>
              {checking ? "Checking…" : t("unlock")}
            </button>
            <button onClick={() => setShowLoginFallback(true)} className="w-full text-center text-xs text-slate-400 hover:text-slate-600 pt-1">
              Don't know the code? Log in instead
            </button>
          </div>
        ) : (
          <div className="p-6 space-y-3">
            <div>
              <label className="text-xs font-medium text-slate-500">{t("loginUsername")}</label>
              <input
                autoFocus value={username} onChange={(e) => { setUsername(e.target.value); setLoginError(false); }}
                onKeyDown={(e) => e.key === "Enter" && submitLoginBypass()}
                className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: loginError ? "#B42318" : LINE }} />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-500">{t("loginPassword")}</label>
              <input
                type="password" value={password} onChange={(e) => { setPassword(e.target.value); setLoginError(false); }}
                onKeyDown={(e) => e.key === "Enter" && submitLoginBypass()}
                className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: loginError ? "#B42318" : LINE }} />
            </div>
            {loginError && <p className="text-xs text-red-600">Incorrect username or password.</p>}
            <button onClick={submitLoginBypass} disabled={checking} className="w-full py-2.5 rounded-lg font-medium text-white disabled:opacity-40" style={{ background: NAVY }}>
              {checking ? "Checking…" : t("loginButton")}
            </button>
            <button onClick={() => setShowLoginFallback(false)} className="w-full text-center text-xs text-slate-400 hover:text-slate-600 pt-1">
              ← Back to access code
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Login gate — no self-service signup. The admin creates every account
// (username + password) from the Team tab and shares credentials manually.
// ---------------------------------------------------------------------------
function IdentityGate({ hasTeam, onCreateAdmin, onLogin, onRequestReset, onConfirmReset }) {
  const { t, dir } = useLang();
  // -------- first-ever setup: create the admin account --------
  const [name, setName] = useState("");
  const [role, setRole] = useState("");
  const [setupInitials, setSetupInitials] = useState("");
  const [setupInitialsTouched, setSetupInitialsTouched] = useState(false);
  const [setupUsername, setSetupUsername] = useState("");
  const [setupPassword, setSetupPassword] = useState("");

  const createAdmin = () => {
    if (!name.trim() || !setupUsername.trim() || !setupPassword.trim()) return;
    const suggested = name.trim().split(" ").filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("");
    onCreateAdmin({
      id: uid(),
      name: name.trim(),
      role: role.trim() || "Admin",
      initials: (setupInitials.trim() || suggested).toUpperCase(),
      username: setupUsername.trim(),
      password: setupPassword,
    });
  };

  // -------- returning: username + password login --------
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);
  const [checking, setChecking] = useState(false);

  const submitLogin = async () => {
    if (!username.trim() || !password.trim()) return;
    setChecking(true);
    const ok = await onLogin(username, password);
    setChecking(false);
    if (!ok) {
      setError(true);
      setPassword("");
    }
  };

  // -------- forgot password --------
  const [mode, setMode] = useState("login"); // "login" | "reset-request" | "reset-confirm"
  const [resetId, setResetId] = useState("");
  const [resetCode, setResetCode] = useState("");
  const [resetNewPassword, setResetNewPassword] = useState("");
  const [resetMsg, setResetMsg] = useState(null); // { type: "error"|"info", text }
  const [resetBusy, setResetBusy] = useState(false);
  const [resetMemberId, setResetMemberId] = useState(null);

  const submitResetRequest = async () => {
    if (!resetId.trim()) return;
    setResetBusy(true);
    setResetMsg(null);
    const res = await onRequestReset(resetId);
    setResetBusy(false);
    if (!res.ok) {
      setResetMsg({ type: "error", text: res.reason === "noemail" ? t("noRecoveryEmail") : t("accountNotFound") });
      return;
    }
    setResetMemberId(res.memberId);
    setResetMsg({ type: "info", text: t("resetCodeSent") });
    setMode("reset-confirm");
  };

  const submitResetConfirm = async () => {
    if (!resetCode.trim() || !resetNewPassword.trim()) return;
    setResetBusy(true);
    setResetMsg(null);
    const ok = await onConfirmReset(resetId, resetCode, resetNewPassword);
    setResetBusy(false);
    if (!ok) {
      setResetMsg({ type: "error", text: t("resetCodeWrong") });
      return;
    }
    // onConfirmReset already logs the person in on success
  };

  return (
    <div dir={dir} style={{ background: NAVY, minHeight: "100vh" }} className="flex items-center justify-center px-4">
      <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div style={{ background: NAVY_DARK }} className="px-6 py-5">
          <p style={{ color: GOLD }} className="text-xs font-semibold tracking-widest uppercase">RSTMS</p>
          <h1 className="text-white text-xl font-bold mt-1">{t("loginTitle")}</h1>
          <p className="text-slate-300 text-sm mt-1">{t("loginSubtitle")}</p>
        </div>
        <div className="p-6">
          {!hasTeam ? (
            <div className="space-y-3">
              <div className="flex gap-2 p-2.5 rounded-lg text-xs" style={{ background: "#FBF3DE", color: "#7A5B06" }}>
                <ShieldAlert size={16} className="shrink-0" />
                <p>No accounts exist yet. Set up your admin account — you'll be the only one who can create logins for the rest of the team.</p>
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("name")}</label>
                <input value={name} onChange={(e) => { setName(e.target.value); if (!setupInitialsTouched) setSetupInitials(e.target.value.split(" ").filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("")); }} placeholder="e.g. Ahmed Gomaa"
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: LINE }} />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("role")}</label>
                <input value={role} onChange={(e) => setRole(e.target.value)} placeholder="e.g. Structural Discipline Lead"
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: LINE }} />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("initials")} (company ID)</label>
                <input value={setupInitials} onChange={(e) => { setSetupInitials(e.target.value.toUpperCase()); setSetupInitialsTouched(true); }} placeholder="e.g. AG"
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 font-mono" style={{ borderColor: LINE }} />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("username")}</label>
                <input value={setupUsername} onChange={(e) => setSetupUsername(e.target.value)} placeholder="e.g. ahmed"
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: LINE }} />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("password")}</label>
                <input type="password" value={setupPassword} onChange={(e) => setSetupPassword(e.target.value)} placeholder="Password"
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: LINE }} />
              </div>
              <button
                disabled={!name.trim() || !setupUsername.trim() || !setupPassword.trim()}
                onClick={createAdmin}
                className="w-full py-2.5 rounded-lg font-medium text-white disabled:opacity-40"
                style={{ background: NAVY }}
              >
                {t("createAdmin")}
              </button>
            </div>
          ) : mode === "login" ? (
            <div className="space-y-3">
              <div>
                <label className="text-xs font-medium text-slate-500">{t("loginUsername")}</label>
                <input
                  autoFocus value={username} onChange={(e) => { setUsername(e.target.value); setError(false); }}
                  onKeyDown={(e) => e.key === "Enter" && submitLogin()}
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: error ? "#B42318" : LINE }} />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("loginPassword")}</label>
                <input
                  type="password" value={password} onChange={(e) => { setPassword(e.target.value); setError(false); }}
                  onKeyDown={(e) => e.key === "Enter" && submitLogin()}
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: error ? "#B42318" : LINE }} />
              </div>
              {error && <p className="text-xs text-red-600">Incorrect username or password. Ask your admin if you're not sure.</p>}
              <button disabled={checking} onClick={submitLogin} className="w-full py-2.5 rounded-lg font-medium text-white disabled:opacity-40" style={{ background: NAVY }}>
                {checking ? "Checking…" : t("loginButton")}
              </button>
              <button onClick={() => { setMode("reset-request"); setResetId(username); setResetMsg(null); }} className="w-full text-center text-xs text-slate-400 hover:text-slate-600">
                {t("forgotPassword")}
              </button>
              <p className="text-[11px] text-slate-400 text-center">{t("noLoginYet")}</p>
            </div>
          ) : mode === "reset-request" ? (
            <div className="space-y-3">
              <div>
                <label className="text-xs font-medium text-slate-500">{t("loginUsername")}</label>
                <input
                  autoFocus value={resetId} onChange={(e) => setResetId(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && submitResetRequest()}
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: LINE }} />
              </div>
              {resetMsg && resetMsg.type === "error" && <p className="text-xs text-red-600">{resetMsg.text}</p>}
              <button disabled={resetBusy} onClick={submitResetRequest} className="w-full py-2.5 rounded-lg font-medium text-white disabled:opacity-40" style={{ background: NAVY }}>
                {resetBusy ? "…" : t("sendResetCode")}
              </button>
              <button onClick={() => { setMode("login"); setResetMsg(null); }} className="w-full text-center text-xs text-slate-400 hover:text-slate-600">
                {t("backToLogin")}
              </button>
            </div>
          ) : (
            <div className="space-y-3">
              <p className="text-xs text-slate-500">{t("enterResetCode")}</p>
              {resetMsg && <p className={`text-xs ${resetMsg.type === "error" ? "text-red-600" : "text-slate-500"}`}>{resetMsg.text}</p>}
              <div>
                <label className="text-xs font-medium text-slate-500">{t("resetCode")}</label>
                <input
                  autoFocus value={resetCode} onChange={(e) => setResetCode(e.target.value.replace(/\D/g, ""))} maxLength={6}
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 tracking-[0.4em] text-center" style={{ borderColor: LINE }} />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500">{t("newPassword")}</label>
                <input
                  type="password" value={resetNewPassword} onChange={(e) => setResetNewPassword(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && submitResetConfirm()}
                  className="w-full mt-1 border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: LINE }} />
              </div>
              <button disabled={resetBusy} onClick={submitResetConfirm} className="w-full py-2.5 rounded-lg font-medium text-white disabled:opacity-40" style={{ background: NAVY }}>
                {resetBusy ? "…" : t("resetPassword")}
              </button>
              <button onClick={() => { setMode("login"); setResetMsg(null); }} className="w-full text-center text-xs text-slate-400 hover:text-slate-600">
                {t("backToLogin")}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Avatar({ name, initials, size = 34 }) {
  const derived = (name || "?").split(" ").filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("");
  const shown = (initials || "").trim().toUpperCase() || derived || "?";
  return (
    <div
      className="rounded-full flex items-center justify-center text-white font-semibold shrink-0"
      style={{ width: size, height: size, background: NAVY, fontSize: size * 0.34 }}
      title={name}
    >
      {shown}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Settings — team access code + personal PIN management
// ---------------------------------------------------------------------------
function SettingsModal({ data, persist, access, persistAccess, identity, onClose, showToast, callLink, persistCallLink, onShare }) {
  const { t } = useLang();
  const [showCode, setShowCode] = useState(false);
  const [newCode, setNewCode] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [newRecoveryEmail, setNewRecoveryEmail] = useState("");
  const [newCallLink, setNewCallLink] = useState("");
  const me = data.team.find((t) => t.id === identity.id || (identity.username && t.username === identity.username) || (identity.initials && t.initials === identity.initials));
  const isAdmin = data.adminId === identity.id;
  const admin = data.team.find((t) => t.id === data.adminId);

function projectHealth(project, tasks) {
  const pTasks = tasks.filter((t) => t.projectId === project.id);
  if (pTasks.length === 0) return { level: "none", label: "No data yet", color: "#94A3B8", dot: "#CBD5E1" };
  const openTasks = pTasks.filter((t) => t.status !== "done");
  const overdue = pTasks.filter((t) => t.dueDate && t.status !== "done" && new Date(t.dueDate) < new Date());
  const overdueRatio = openTasks.length ? overdue.length / openTasks.length : 0;
  if (overdue.length >= 3 || overdueRatio > 0.4) {
    return { level: "critical", label: "Critical", color: "#B42318", dot: "#B42318" };
  }
  if (overdue.length > 0) {
    return { level: "attention", label: "Needs Attention", color: "#B5730A", dot: "#ED8001" };
  }
  return { level: "healthy", label: "Healthy", color: "#006450", dot: "#006450" };
}
function projectLabel(projects, id) {
  const p = projects.find((p) => p.id === id);
  return p ? `${p.code} · ${p.name}` : "—";
}
function authorName(team, id, identity) {
  if (identity && id === identity.id) return identity.name;
  const m = team.find((t) => t.id === id);
  return m ? m.name : "Unknown";
}
function renderMentionText(text, team) {
  if (!text) return text;
  const names = team.map((m) => m.name).filter(Boolean).sort((a, b) => b.length - a.length);
  if (names.length === 0) return text;
  const escaped = names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const regex = new RegExp("@(" + escaped.join("|") + ")", "g");
  const parts = [];
  let lastIndex = 0;
  let match;
  let key = 0;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) parts.push(text.slice(lastIndex, match.index));
    parts.push(<span key={key++} className="font-semibold" style={{ color: GOLD }}>@{match[1]}</span>);
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) parts.push(text.slice(lastIndex));
  return parts;
}
function computeMentions(text, team) {
  if (!text) return [];
  const found = [];
  team.forEach((m) => { if (m.name && text.includes("@" + m.name)) found.push(m.id); });
  return found;
}

// ---------------------------------------------------------------------------
// Firebase signaling helpers for native WebRTC calling — no third-party
// meeting service, just the Firebase Realtime Database already in use.
// ---------------------------------------------------------------------------
const ICE_SERVERS = [
  { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] },
];
// finds a transceiver by media kind using the RECEIVER's track (always populated
// with the correct kind once negotiated, unlike sender.track which can be null) —
// safer than assuming a fixed array order across different browser implementations
function getTransceiverByKind(pc, kind) {
  const list = pc.getTransceivers();
  return list.find((t) => t.receiver && t.receiver.track && t.receiver.track.kind === kind) || list.find((t) => t.mid !== null && t.sender && t.sender.track && t.sender.track.kind === kind) || null;
}
function fbUrl(path) { return window.FIREBASE_DB_URL + "/" + path + ".json"; }
async function fbSet(path, value) {
  await fetch(fbUrl(path), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(value) });
}
async function fbGet(path) {
  try {
    const res = await fetch(fbUrl(path));
    return await res.json();
  } catch (e) { return null; }
}
async function fbDelete(path) {
  try { await fetch(fbUrl(path), { method: "DELETE" }); } catch (e) {}
}
// listens for ANY change under `path` and calls onChange() (no payload — caller re-fetches
// the authoritative current state with fbGet, simpler and more robust than parsing SSE diffs)
function fbListen(path, onChange) {
  let es;
  try {
    es = new EventSource(fbUrl(path));
    es.addEventListener("put", onChange);
    es.addEventListener("patch", onChange);
    es.onerror = () => {}; // browser auto-reconnects
  } catch (e) {}
  return { close: () => { try { es && es.close(); } catch (e) {} } };
}

  const [name, setName] = useState("");
  const [teamFor, setTeamFor] = useState(null); // project being edited

  const addProject = () => {
    if (!name.trim()) return;
    persist({ ...data, projects: [...projects, { id: uid(), code: code.trim() || "—", name: name.trim(), memberIds: [] }] });
    setCode(""); setName(""); setShowAdd(false);
  };
  const removeProject = (id) => {
    persist({ ...data, projects: projects.filter((p) => p.id !== id), tasks: tasks.filter((t) => t.projectId !== id) });

  const toggleMember = (projectId, memberId) => {

      if (p.id !== projectId) return p;
      const ids = p.memberIds || [];
      return { ...p, memberIds: ids.includes(memberId) ? ids.filter((id) => id !== memberId) : [...ids, memberId] };
    });
    persist({ ...data, projects: next });
    setTeamFor((cur) => (cur ? next.find((p) => p.id === cur.id) : cur));

  return (

            <Plus size={15} /> {t("addProject")}

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {projects.map((p) => {

function Tasks({ data, persist, identity, filter, setFilter }) {
  const { t } = useLang();
  const { projects, team, tasks } = data;
  const [showAdd, setShowAdd] = useState(false);
  const [openTask, setOpenTask] = useState(null);
  const isAdmin = data.adminId === identity.id;

  const filtered = tasks.filter((t) =>
    (filter.project === "all" || t.projectId === filter.project) &&
    (filter.assignee === "all" || t.assigneeId === filter.assignee)
  );

  // ensure a task's assignee is also a member of that project's channel — assigning
  // work to someone should always mean they can see that project's messages too
  const ensureProjectMember = (list, projectId, memberId) => {
    if (!projectId || !memberId) return list;
    return list.map((p) => {
      if (p.id !== projectId) return p;
      const ids = p.memberIds || [];
      return ids.includes(memberId) ? p : { ...p, memberIds: [...ids, memberId] };
    });
  };

  const addTask = (task) => {
    if (!isAdmin) return;
    const nextProjects = ensureProjectMember(projects, task.projectId, task.assigneeId);
    persist({ ...data, projects: nextProjects, tasks: [...tasks, { ...task, id: uid(), createdAt: now(), createdBy: identity.id, status: "todo", comments: [] }] });
    setShowAdd(false);
  };
  const updateTask = (id, patch) => {
    if (!isAdmin) return;
    const next = tasks.map((t) => (t.id === id ? { ...t, ...patch } : t));
    const current = tasks.find((t) => t.id === id);
    const projectId = patch.projectId || (current && current.projectId);
    const nextProjects = patch.assigneeId ? ensureProjectMember(projects, projectId, patch.assigneeId) : projects;
    persist({ ...data, projects: nextProjects, tasks: next });
    if (openTask && openTask.id === id) setOpenTask({ ...openTask, ...patch });
  };
  const addComment = (taskId, comment) => {
    const next = tasks.map((t) => t.id === taskId ? { ...t, comments: [...(t.comments || []), comment] } : t);
    persist({ ...data, tasks: next });
    setOpenTask((cur) => cur ? { ...cur, comments: [...(cur.comments || []), comment] } : cur);
  };
  const addAttachment = (taskId, attachment) => {
    const next = tasks.map((t) => t.id === taskId ? { ...t, attachments: [...(t.attachments || []), attachment] } : t);
    persist({ ...data, tasks: next });
    setOpenTask((cur) => cur ? { ...cur, attachments: [...(cur.attachments || []), attachment] } : cur);
  };
  const removeAttachment = (taskId, attachmentId) => {
    const next = tasks.map((t) => t.id === taskId ? { ...t, attachments: (t.attachments || []).filter((a) => a.id !== attachmentId) } : t);
    persist({ ...data, tasks: next });
    setOpenTask((cur) => cur ? { ...cur, attachments: (cur.attachments || []).filter((a) => a.id !== attachmentId) } : cur);
    if (window.FIREBASE_DB_URL) {
      fetch(window.FIREBASE_DB_URL + "/shared/files/" + attachmentId + ".json", { method: "DELETE" }).catch(() => {});
    }
  };
  const deleteTask = (id) => {
    if (!isAdmin) return;
    persist({ ...data, tasks: tasks.filter((t) => t.id !== id) });
    setOpenTask(null);
  };

  const columns = ["todo", "inprogress", "review", "done"];

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-bold" style={{ color: NAVY }}>{t("navTasks")}</h1>
          <p className="text-sm text-slate-500 mt-0.5">
            {isAdmin ? t("tasksSubtitleAdmin") : t("tasksSubtitleTeam")}
          </p>
        </div>
        {isAdmin && (
          <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 text-sm font-medium text-white px-3 py-2 rounded-lg" style={{ background: NAVY }}>
            <Plus size={15} /> {t("newTask")}
          </button>
        )}
      </div>

      <div className="flex flex-wrap gap-2">
        <select value={filter.project} onChange={(e) => setFilter({ ...filter, project: e.target.value })} className="input !w-auto text-xs">
          <option value="all">{t("allProjects")}</option>
          {projects.map((p) => <option key={p.id} value={p.id}>{p.code} · {p.name}</option>)}
        </select>
        <select value={filter.assignee} onChange={(e) => setFilter({ ...filter, assignee: e.target.value })} className="input !w-auto text-xs">
          <option value="all">{t("allTeam")}</option>
          {team.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
      </div>

      <div className="flex md:grid md:grid-cols-4 gap-4 overflow-x-auto pb-2 -mx-4 px-4 md:mx-0 md:px-0" style={{ scrollSnapType: "x proximity" }}>
        {columns.map((col) => (
          <div key={col} className="bg-slate-50 rounded-xl p-3 min-h-[200px] shrink-0 w-[78vw] sm:w-72 md:w-auto" style={{ scrollSnapAlign: "start" }}>
            <div className="flex items-center gap-2 mb-3 px-1">
              <span className="w-2 h-2 rounded-full" style={{ background: STATUS[col].color }} />
              <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: STATUS[col].color }}>{t(col)}</p>
              <span className="text-[10px] text-slate-400 ml-auto">{filtered.filter((t) => t.status === col).length}</span>
            </div>
            <div className="space-y-2">
              {filtered.filter((t) => t.status === col).map((t) => (
                <TaskCard key={t.id} task={t} project={projects.find((p) => p.id === t.projectId)} assignee={team.find((m) => m.id === t.assigneeId)}
                  onClick={() => setOpenTask(t)} />
              ))}
              {filtered.filter((t) => t.status === col).length === 0 && (
                <p className="text-[11px] text-slate-300 text-center py-6">{t("noTasks")}</p>
              )}
            </div>
          </div>
        ))}
      </div>
      <p className="text-[11px] text-slate-400 md:hidden">Swipe sideways to see all 4 columns →</p>

      {showAdd && isAdmin && (
        <TaskModal projects={projects} team={team} onClose={() => setShowAdd(false)} onSave={addTask} />
      )}
      {openTask && (
        <TaskDetail task={openTask} project={projects.find((p) => p.id === openTask.projectId)} team={team} identity={identity} isAdmin={isAdmin}
          onClose={() => setOpenTask(null)} onUpdate={updateTask} onComment={addComment} onDelete={deleteTask}
          onAddAttachment={addAttachment} onRemoveAttachment={removeAttachment} />
      )}
    </div>
  );
}

      <div className="flex items-center justify-between mt-2.5">

            {PRIORITY[task.priority].label}

            <Calendar size={10} /> {fmtDate(task.dueDate)}

            <p className="text-[10px] text-slate-400 flex items-center gap-1"><MessageCircle size={10} /> {task.comments.length}</p>
