function dataUrlToBlobUrl(dataUrl) {
  const parts = dataUrl.split(",");
  const meta = parts[0];
  const isBase64 = meta.indexOf("base64") !== -1;
  const mimeMatch = meta.match(/data:([^;]+)/);
  const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
  let bytes;
  if (isBase64) {
    const binary = atob(parts[1]);
    bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  } else {
    bytes = new TextEncoder().encode(decodeURIComponent(parts[1]));
  }
  const blob = new Blob([bytes], { type: mime });
  return URL.createObjectURL(blob);
}
function formatBytes(bytes) {
  if (!bytes) return "0 KB";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
const MAX_ATTACHMENT_BYTES = 3 * 1024 * 1024; // 3 MB — keeps the shared database fast

function TaskDetail({ task, project, team, identity, isAdmin, onClose, onUpdate, onComment, onDelete, onAddAttachment, onRemoveAttachment }) {
  const { t } = useLang();
  const [text, setText] = useState("");
  const [ctype, setCtype] = useState("comment");
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const [busyAttachmentId, setBusyAttachmentId] = useState(null);
  const fileInputRef = useRef(null);
  const assignee = team.find((m) => m.id === task.assigneeId);
  const attachments = task.attachments || [];

  const submit = () => {
    if (!text.trim()) return;
    onComment(task.id, { id: uid(), authorId: identity.id, type: ctype, text: text.trim(), createdAt: now() });
    setText("");
  };

  const pickFile = () => fileInputRef.current && fileInputRef.current.click();

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setUploadError("");
    if (file.size > MAX_ATTACHMENT_BYTES) {
      setUploadError(`"${file.name}" is ${formatBytes(file.size)} — the limit is 3 MB per file.`);
      return;
    }
    if (!window.FIREBASE_DB_URL) {
      setUploadError("File storage isn't connected.");
      return;
    }
    setUploading(true);
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const fileId = uid();
      fetch(window.FIREBASE_DB_URL + "/shared/files/" + fileId + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dataUrl),
      })
        .then(() => {
          onAddAttachment(task.id, {
            id: fileId, name: file.name, mimeType: file.type || "application/octet-stream",
            size: file.size, uploadedBy: identity.id, uploadedAt: now(),
          });
        })
        .catch(() => setUploadError("Upload failed — check your connection and try again."))
        .finally(() => setUploading(false));
    };
    reader.onerror = () => { setUploadError("Couldn't read that file."); setUploading(false); };
    reader.readAsDataURL(file);
  };

  const openAttachment = async (att, download) => {
    setBusyAttachmentId(att.id);
    try {
      const res = await fetch(window.FIREBASE_DB_URL + "/shared/files/" + att.id + ".json");
      const dataUrl = await res.json();
      const blobUrl = dataUrlToBlobUrl(dataUrl);
      if (download) {
        const a = document.createElement("a");
        a.href = blobUrl; a.download = att.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      } else {
        window.open(blobUrl, "_blank");
      }
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (e) {
      setUploadError("Couldn't load that file.");
    }
    setBusyAttachmentId(null);
  };

  const canRemove = (att) => isAdmin || att.uploadedBy === identity.id;

  return (
    <Modal title={project ? `${project.code} · ${project.name}` : "Task"} onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex items-start justify-between gap-3">
          <h3 className="text-base font-semibold leading-snug">{task.title}</h3>
          {isAdmin && (
            <button onClick={() => onDelete(task.id)} className="text-slate-300 hover:text-red-500 shrink-0"><Trash2 size={15} /></button>
          )}
        </div>
        {task.description && <p className="text-sm text-slate-600">{task.description}</p>}

        <div className="grid sm:grid-cols-3 gap-3">
          <Field label="Status">
            {isAdmin ? (
              <select value={task.status} onChange={(e) => onUpdate(task.id, { status: e.target.value })} className="input">
                {Object.entries(STATUS).map(([k, v]) => <option key={k} value={k}>{t(k)}</option>)}
              </select>
            ) : (
              <div className="flex items-center gap-1.5 text-sm py-2">
                <span className="w-2 h-2 rounded-full" style={{ background: STATUS[task.status].color }} />
                {t(task.status)}
              </div>
            )}
          </Field>
          <Field label="Assignee">
            {isAdmin ? (
              <select value={task.assigneeId || ""} onChange={(e) => onUpdate(task.id, { assigneeId: e.target.value || null })} className="input">
                <option value="">Unassigned</option>
                {team.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            ) : (
              <p className="text-sm py-2">{assignee ? assignee.name : "Unassigned"}</p>
            )}
          </Field>
          <Field label="Due date">
            {isAdmin ? (
              <input type="date" value={task.dueDate || ""} onChange={(e) => onUpdate(task.id, { dueDate: e.target.value || null })} className="input" />
            ) : (
              <p className="text-sm py-2">{task.dueDate ? fmtDate(task.dueDate) : "—"}</p>
            )}
          </Field>
        </div>
        {!isAdmin && (
          <p className="text-[11px] text-slate-400 -mt-2">Status, assignee, and due date are managed by the admin — you can add comments, markups, and files below.</p>
        )}

        <div>
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs font-semibold text-slate-500">FILES &amp; DRAWINGS ({attachments.length})</p>
            <button onClick={pickFile} disabled={uploading} className="flex items-center gap-1 text-xs font-medium px-2 py-1 rounded-lg disabled:opacity-50" style={{ background: PAPER, color: NAVY }}>
              <Paperclip size={12} /> {uploading ? "Uploading…" : "Attach file"}
            </button>
            <input ref={fileInputRef} type="file" onChange={handleFile} className="hidden" />
          </div>
          {uploadError && <p className="text-xs text-red-600 mb-2">{uploadError}</p>}
          {attachments.length === 0 ? (
            <p className="text-[11px] text-slate-400 mb-1">No files yet — photos, drawings, or PDFs, up to 3 MB each.</p>
          ) : (
            <div className="space-y-1.5 mb-1">
              {attachments.map((att) => (
                <div key={att.id} className="flex items-center gap-2 p-2 rounded-lg text-xs" style={{ background: PAPER }}>
                  {att.mimeType && att.mimeType.startsWith("image/") ? <ImageIcon size={14} className="text-slate-400 shrink-0" /> : <FileIcon size={14} className="text-slate-400 shrink-0" />}
                  <div className="min-w-0 flex-1">
                    <p className="font-medium truncate">{att.name}</p>
                    <p className="text-slate-400">{formatBytes(att.size)} · {authorName(team, att.uploadedBy, identity)}</p>
                  </div>
                  <button disabled={busyAttachmentId === att.id} onClick={() => openAttachment(att, false)} className="text-slate-400 hover:text-slate-700 shrink-0" title="View">
                    <Eye size={13} />
                  </button>
                  <button disabled={busyAttachmentId === att.id} onClick={() => openAttachment(att, true)} className="text-slate-400 hover:text-slate-700 shrink-0" title="Download">
                    <Download size={13} />
                  </button>
                  {canRemove(att) && (
                    <button onClick={() => onRemoveAttachment(task.id, att.id)} className="text-slate-300 hover:text-red-500 shrink-0" title="Remove">
                      <Trash2 size={13} />
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>

        <div>
          <p className="text-xs font-semibold text-slate-500 mb-2">REVIEW &amp; COMMENTS ({(task.comments || []).length})</p>
          <div className="space-y-2 max-h-56 overflow-y-auto pr-1 mb-3">
            {(task.comments || []).length === 0 && <EmptyHint text="No comments yet. Add a review comment or markup below." />}
            {(task.comments || []).map((c) => (
              <div key={c.id} className="p-2.5 rounded-lg text-xs" style={{ background: c.type === "markup" ? "#FBF3DE" : PAPER, borderLeft: c.type === "markup" ? `3px solid ${GOLD}` : "3px solid transparent" }}>
                <div className="flex items-center gap-1.5 mb-1">
                  {c.type === "markup" ? <Flag size={11} style={{ color: GOLD }} /> : <MessageCircle size={11} className="text-slate-400" />}
                  <span className="font-semibold">{authorName(team, c.authorId, identity)}</span>
                  <span className="text-slate-400">{fmtDateTime(c.createdAt)}</span>
                </div>
                <p>{c.text}</p>
              </div>
            ))}
          </div>
          <div className="flex gap-2 mb-2 text-[11px]">
            <button onClick={() => setCtype("comment")} className="px-2 py-1 rounded" style={ctype === "comment" ? { background: NAVY, color: "white" } : { background: "#F1F0EC" }}>Comment</button>
            <button onClick={() => setCtype("markup")} className="px-2 py-1 rounded" style={ctype === "markup" ? { background: GOLD, color: "white" } : { background: "#F1F0EC" }}>Markup</button>
          </div>
          <div className="flex gap-2">
            <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder={ctype === "markup" ? "Note a revision / markup on this item…" : "Add a comment…"} className="input flex-1" />
            <button onClick={submit} className="px-3 rounded-lg text-white shrink-0" style={{ background: NAVY }}><Send size={15} /></button>
          </div>
        </div>
      </div>
    </Modal>
  );
}

// Team
// ---------------------------------------------------------------------------
function Team({ data, persist, identity, presence, onCall, callPhase }) {
  const { t } = useLang();
  const { team, tasks } = data;
  const isAdmin = data.adminId === identity.id;
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState("");
  const [role, setRole] = useState("");
  const [initials, setInitials] = useState("");
  const [initialsTouched, setInitialsTouched] = useState(false);
  const [newUsername, setNewUsername] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [addError, setAddError] = useState("");
  const [editFor, setEditFor] = useState(null); // member the admin is editing
  const [editName, setEditName] = useState("");
  const [editRole, setEditRole] = useState("");
  const [editInitials, setEditInitials] = useState("");
  const [resetPassword, setResetPassword] = useState("");
  const [resetUsername, setResetUsername] = useState("");
  const [showCreds, setShowCreds] = useState(false);
  const [usernameError, setUsernameError] = useState("");
  const isOnline = (id) => !!(presence && presence[id] && (Date.now() - new Date(presence[id]).getTime()) < 90000);

  const suggestInitials = (n) => n.split(" ").filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("");

  const addMember = () => {
    setAddError("");
    if (!name.trim() || !newUsername.trim() || !newPassword.trim()) return;
    if (team.some((t) => (t.username || "").toLowerCase() === newUsername.trim().toLowerCase())) {
      setAddError("That username is already taken — choose another.");
      return;
    }
    persist({
      ...data,
      team: [...team, {
        id: uid(), name: name.trim(), role: role.trim() || "Team Member",
        initials: (initials.trim() || suggestInitials(name)).toUpperCase(),
        username: newUsername.trim(), password: newPassword,
      }],
    });
    setName(""); setRole(""); setInitials(""); setInitialsTouched(false); setNewUsername(""); setNewPassword(""); setShowAdd(false);
  };
  const removeMember = (id) => {
    if (id === identity.id || id === data.adminId) return;
    persist({ ...data, team: team.filter((t) => t.id !== id) });
  };
  const openEdit = (m) => {
    setEditFor(m);
    setEditName(m.name); setEditRole(m.role); setEditInitials(m.initials || "");
    setShowCreds(false); setResetPassword(""); setResetUsername(""); setUsernameError("");
  };
  const saveEditDetails = () => {
    if (!editFor || !editName.trim()) return;
    persist({
      ...data,
      team: team.map((t) => (t.id === editFor.id ? { ...t, name: editName.trim(), role: editRole.trim() || "Team Member", initials: editInitials.trim().toUpperCase() } : t)),
    });
    setEditFor((cur) => (cur ? { ...cur, name: editName.trim(), role: editRole.trim(), initials: editInitials.trim().toUpperCase() } : cur));
  };
  const saveResetPassword = () => {
    if (!resetPassword.trim() || !editFor) return;
    persist({ ...data, team: team.map((t) => (t.id === editFor.id ? { ...t, password: resetPassword } : t)) });
    setEditFor((cur) => (cur ? { ...cur, password: resetPassword } : cur));
    setResetPassword("");
  };
  const saveResetUsername = () => {
    setUsernameError("");
    if (!resetUsername.trim() || !editFor) return;
    if (team.some((t) => t.id !== editFor.id && (t.username || "").toLowerCase() === resetUsername.trim().toLowerCase())) {
      setUsernameError("That username is already taken.");
      return;
    }
    persist({ ...data, team: team.map((t) => (t.id === editFor.id ? { ...t, username: resetUsername.trim() } : t)) });
    setEditFor((cur) => (cur ? { ...cur, username: resetUsername.trim() } : cur));
    setResetUsername("");
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-xl font-bold" style={{ color: NAVY }}>{t("navTeam")}</h1>
          <p className="text-sm text-slate-500 mt-0.5">
            {isAdmin ? t("teamSubtitleAdmin") : t("teamSubtitleView")}
          </p>
        </div>
        {isAdmin && (
          <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 text-sm font-medium text-white px-3 py-2 rounded-lg" style={{ background: NAVY }}>
            <Plus size={15} /> {t("addMember")}
          </button>
        )}
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {team.map((m) => {
          const open = tasks.filter((t) => t.assigneeId === m.id && t.status !== "done").length;
          const online = isOnline(m.id);
          return (
            <div key={m.id} className="bg-white rounded-xl border p-4 flex items-center gap-3" style={{ borderColor: LINE }}>
              <div className="relative shrink-0">
                <Avatar name={m.name} initials={m.initials} size={38} />
                <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white" style={{ background: online ? TEAL : "#94A3B8" }} title={online ? "Online now" : "Offline"} />
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-semibold truncate flex items-center gap-1.5">
                  {m.name}
                  {m.id === identity.id && <span className="text-[10px] font-normal text-slate-400">({t("you")})</span>}
                  {m.id === data.adminId && <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded" style={{ background: NAVY, color: "white" }}>{t("admin")}</span>}
                </p>
                <p className="text-xs text-slate-500 truncate">{m.role} {m.initials && <span className="font-mono text-slate-400">· {m.initials}</span>}</p>
                <p className="text-[11px] mt-0.5" style={{ color: GOLD }}>{open} {t("openTasksCount")}</p>
              </div>
              {m.id !== identity.id && (
                <button onClick={() => onCall(m.id, m.name)} disabled={callPhase !== "idle"}
                  className="p-1.5 rounded-lg disabled:opacity-30" style={{ background: PAPER, color: TEAL }} title={`Call ${m.name}`}>
                  <PhoneCall size={14} />
                </button>
              )}
              {isAdmin && (
                <button onClick={() => openEdit(m)} className="text-slate-300 hover:text-slate-600" title="Edit member / login">
                  <Lock size={14} />
                </button>
              )}
              {isAdmin && m.id !== identity.id && m.id !== data.adminId && (
                <button onClick={() => removeMember(m.id)} className="text-slate-300 hover:text-red-500"><Trash2 size={14} /></button>
              )}
            </div>
          );
        })}
      </div>

      {showAdd && (
        <Modal title={t("addMember")} onClose={() => { setShowAdd(false); setAddError(""); }}>
          <div className="space-y-3">
            <Field label={t("name")}>
              <input value={name} onChange={(e) => { setName(e.target.value); if (!initialsTouched) setInitials(suggestInitials(e.target.value)); }} className="input" />
            </Field>
            <Field label={t("role")}><input value={role} onChange={(e) => setRole(e.target.value)} placeholder="e.g. Structural Engineer" className="input" /></Field>
            <Field label={t("initials") + " (company ID)"}>
              <input value={initials} onChange={(e) => { setInitials(e.target.value.toUpperCase()); setInitialsTouched(true); }} placeholder="e.g. AG" className="input font-mono" style={{ textTransform: "uppercase" }} />
            </Field>
            <Field label={t("username")}><input value={newUsername} onChange={(e) => setNewUsername(e.target.value)} placeholder="e.g. nizam" className="input" /></Field>
            <Field label={t("password")}><input value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="Set a password for them" className="input" /></Field>
            {addError && <p className="text-xs text-red-600">{addError}</p>}
            <button onClick={addMember} className="w-full py-2 rounded-lg text-white text-sm font-medium" style={{ background: NAVY }}>{t("addMember")}</button>
            <p className="text-[11px] text-slate-400">Send this username and password to them yourself (WhatsApp, etc.) — it won't be shown to anyone else in the dashboard.</p>
          </div>
        </Modal>
      )}

      {editFor && (
        <Modal title={`Edit ${editFor.name}`} onClose={() => { setEditFor(null); setUsernameError(""); setResetUsername(""); }} wide>
          <div className="space-y-5">
            <div>
              <p className="text-xs font-semibold text-slate-500 mb-2">DETAILS</p>
              <div className="space-y-3">
                <Field label={t("name")}><input value={editName} onChange={(e) => setEditName(e.target.value)} className="input" /></Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field label={t("role")}><input value={editRole} onChange={(e) => setEditRole(e.target.value)} className="input" /></Field>
                  <Field label={t("initials")}><input value={editInitials} onChange={(e) => setEditInitials(e.target.value.toUpperCase())} className="input font-mono" /></Field>
                </div>
                <button onClick={saveEditDetails} className="px-4 py-2 rounded-lg text-white text-xs font-medium" style={{ background: NAVY }}>{t("save")}</button>
              </div>
            </div>

            <div className="pt-1 border-t" style={{ borderColor: LINE }}>
              <p className="text-xs font-semibold text-slate-500 mb-2 mt-4">LOGIN</p>
              {!editFor.username && (
                <div className="flex gap-2 p-2.5 rounded-lg text-xs mb-2" style={{ background: "#FBF3DE", color: "#7A5B06" }}>
                  <ShieldAlert size={16} className="shrink-0" />
                  <p>This person doesn't have a login yet — set a username and password below and send them to them yourself.</p>
                </div>
              )}
              <div className="space-y-3">
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Username</label>
                  <div className="flex gap-2">
                    <input value={resetUsername || editFor.username || ""} onChange={(e) => setResetUsername(e.target.value)} placeholder="e.g. nizam" className="input flex-1" />
                    <button onClick={saveResetUsername} className="px-3 rounded-lg text-white text-xs font-medium shrink-0" style={{ background: NAVY }}>{t("save")}</button>
                  </div>
                  {usernameError && <p className="text-xs text-red-600 mt-1">{usernameError}</p>}
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Current password</label>
                  <div className="flex items-center gap-2 border rounded-lg px-3 py-2" style={{ borderColor: LINE }}>
                    <span className="flex-1 text-sm font-mono">{showCreds ? (editFor.password || "—") : "••••••••"}</span>
                    <button onClick={() => setShowCreds((s) => !s)} className="text-slate-400 hover:text-slate-700">
                      {showCreds ? <EyeOff size={15} /> : <Eye size={15} />}
                    </button>
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">{editFor.password ? "Reset password" : "Set password"}</label>
                  <div className="flex gap-2">
                    <input value={resetPassword} onChange={(e) => setResetPassword(e.target.value)} placeholder="New password" className="input flex-1" />
                    <button onClick={saveResetPassword} className="px-3 rounded-lg text-white text-xs font-medium shrink-0" style={{ background: NAVY }}>{t("save")}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Messages({ data, persist, identity, onSent, onStartCall, callLink }) {
  const { t } = useLang();
  const { projects, team, messages } = data;
  const isAdmin = data.adminId === identity.id;
  const visibleProjects = projects.filter((p) => isAdmin || (p.memberIds || []).includes(identity.id));
  const [channel, setChannel] = useState("general");
  const [text, setText] = useState("");
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const [imgCache, setImgCache] = useState({}); // attachmentId -> dataUrl
  const [replyingTo, setReplyingTo] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");
  const [menuOpenId, setMenuOpenId] = useState(null);
  const [forwardingMsg, setForwardingMsg] = useState(null);
  const [mentionQuery, setMentionQuery] = useState(null); // null = not currently typing a mention
  const textInputRef = useRef(null);
  const fileInputRef = useRef(null);
  const endRef = useRef(null);

  const EDIT_WINDOW_MS = 10 * 60 * 1000;
  const DELETE_WINDOW_MS = 5 * 60 * 1000;
  const canEditMsg = (m) => m.authorId === identity.id && !m.deleted && Date.now() - new Date(m.createdAt).getTime() < EDIT_WINDOW_MS;
  const canDeleteMsg = (m) => m.authorId === identity.id && !m.deleted && Date.now() - new Date(m.createdAt).getTime() < DELETE_WINDOW_MS;

  // if the channel currently open stops being visible (e.g. removed from a project), fall back to General
  useEffect(() => {
    if (channel !== "general" && !visibleProjects.find((p) => p.id === channel)) {
      setChannel("general");
    }
  }, [channel, visibleProjects.map((p) => p.id).join(",")]);

  const filtered = messages.filter((m) => (channel === "general" ? !m.projectId : m.projectId === channel));
  const activeProject = channel === "general" ? null : projects.find((p) => p.id === channel);

  useEffect(() => {
    endRef.current?.scrollIntoView({ block: "nearest" });
  }, [filtered.length, channel]);

  // auto-load image previews for image attachments in this channel
  useEffect(() => {
    if (!window.FIREBASE_DB_URL) return;
    const toLoad = filtered.filter((m) => m.attachment && m.attachment.mimeType && m.attachment.mimeType.startsWith("image/") && !imgCache[m.attachment.id]);
    if (toLoad.length === 0) return;
    toLoad.forEach((m) => {
      fetch(window.FIREBASE_DB_URL + "/shared/files/" + m.attachment.id + ".json")
        .then((r) => r.json())
        .then((dataUrl) => setImgCache((cur) => ({ ...cur, [m.attachment.id]: dataUrl })))
        .catch(() => {});
    });
  }, [filtered.map((m) => (m.attachment ? m.attachment.id : "")).join(","), channel]);

  const buildReplySnapshot = (m) => ({
    id: m.id,
    authorName: authorName(team, m.authorId, identity),
    text: m.text || (m.attachment ? m.attachment.name : ""),
  });

  // who can be @mentioned here: whole team in General, otherwise this project's members + admin
  const mentionable = activeProject
    ? team.filter((m) => (activeProject.memberIds || []).includes(m.id) || m.id === data.adminId)
    : team;
  const mentionMatches = mentionQuery === null ? [] : mentionable.filter((m) => m.name.toLowerCase().includes(mentionQuery.toLowerCase())).slice(0, 6);

  const handleTextChange = (val) => {
    setText(val);
    const match = val.match(/(?:^|\s)@([^\s]*)$/);
    setMentionQuery(match ? match[1] : null);
  };

  const selectMention = (member) => {
    setText((cur) => cur.replace(/@([^\s]*)$/, "@" + member.name + " "));
    setMentionQuery(null);
    textInputRef.current && textInputRef.current.focus();
  };

  const send = () => {
    if (!text.trim()) return;
    const mentions = computeMentions(text.trim(), team);
    const msg = {
      id: uid(), authorId: identity.id, projectId: channel === "general" ? null : channel,
      text: text.trim(), createdAt: now(),
      ...(mentions.length ? { mentions } : {}),
      ...(replyingTo ? { replyTo: buildReplySnapshot(replyingTo) } : {}),
    };
    persist({ ...data, messages: [...messages, msg] });
    if (onSent) onSent();
    setText("");
    setReplyingTo(null);
    setMentionQuery(null);
  };

  const pickFile = () => fileInputRef.current && fileInputRef.current.click();

  const uploadFile = (file) => {
    if (!file) return;
    setUploadError("");
    if (file.size > MAX_ATTACHMENT_BYTES) {
      setUploadError(`"${file.name || "Pasted image"}" is ${formatBytes(file.size)} — the limit is 3 MB per file.`);
      return;
    }
    if (!window.FIREBASE_DB_URL) {
      setUploadError("File storage isn't connected.");
      return;
    }
    setUploading(true);
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const fileId = uid();
      fetch(window.FIREBASE_DB_URL + "/shared/files/" + fileId + ".json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dataUrl),
      })
        .then(() => {
          const mentions = computeMentions(text.trim(), team);
          const msg = {
            id: uid(), authorId: identity.id, projectId: channel === "general" ? null : channel,
            text: text.trim(), createdAt: now(),
            attachment: { id: fileId, name: file.name || "Screenshot.png", mimeType: file.type || "application/octet-stream", size: file.size },
            ...(mentions.length ? { mentions } : {}),
            ...(replyingTo ? { replyTo: buildReplySnapshot(replyingTo) } : {}),
          };
          persist({ ...data, messages: [...messages, msg] });
          if (onSent) onSent();
          setText("");
          setReplyingTo(null);
          setMentionQuery(null);
          if (file.type && file.type.startsWith("image/")) setImgCache((cur) => ({ ...cur, [fileId]: dataUrl }));
        })
        .catch(() => setUploadError("Upload failed — check your connection and try again."))
        .finally(() => setUploading(false));
    };
    reader.onerror = () => { setUploadError("Couldn't read that file."); setUploading(false); };
    reader.readAsDataURL(file);
  };

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    uploadFile(file);
  };

  const handlePaste = (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.startsWith("image/")) {
        const file = items[i].getAsFile();
        if (file) {
          e.preventDefault();
          uploadFile(file);
        }
        break;
      }
    }
  };

  const saveEdit = (m) => {
    if (!editText.trim() || !canEditMsg(m)) { setEditingId(null); return; }
    const next = messages.map((msg) => (msg.id === m.id ? { ...msg, text: editText.trim(), editedAt: now() } : msg));
    persist({ ...data, messages: next });
    setEditingId(null);
  };

  const deleteMsg = (m) => {
    if (!canDeleteMsg(m)) return;
    if (!window.confirm(t("deleteMessageConfirm"))) return;
    const next = messages.map((msg) => (msg.id === m.id ? { ...msg, deleted: true, text: "", attachment: null } : msg));
    persist({ ...data, messages: next });
    setMenuOpenId(null);
  };

  const doForward = (targetChannelId) => {
    if (!forwardingMsg) return;
    const msg = {
      id: uid(), authorId: identity.id, projectId: targetChannelId === "general" ? null : targetChannelId,
      text: forwardingMsg.text || "", createdAt: now(),
      ...(forwardingMsg.attachment ? { attachment: forwardingMsg.attachment } : {}),
      forwardedFrom: authorName(team, forwardingMsg.authorId, identity),
    };
    persist({ ...data, messages: [...messages, msg] });
    setForwardingMsg(null);
  };

  const downloadAttachment = async (att) => {
    try {
      const dataUrl = imgCache[att.id] || (await (await fetch(window.FIREBASE_DB_URL + "/shared/files/" + att.id + ".json")).json());
      const blobUrl = dataUrlToBlobUrl(dataUrl);
      const a = document.createElement("a");
      a.href = blobUrl; a.download = att.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (e) {}
  };

  const viewAttachment = async (att) => {
    try {
      const dataUrl = imgCache[att.id] || (await (await fetch(window.FIREBASE_DB_URL + "/shared/files/" + att.id + ".json")).json());
      const blobUrl = dataUrlToBlobUrl(dataUrl);
      window.open(blobUrl, "_blank");
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (e) {}
  };

  const startCall = () => {
    onStartCall(activeProject ? `${activeProject.code} · ${activeProject.name}` : t("general"));
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-bold" style={{ color: NAVY }}>{t("navMessages")}</h1>
        <p className="text-sm text-slate-500 mt-0.5">{t("messagesSubtitle")}</p>
      </div>

      <div className="bg-white rounded-xl border flex flex-col md:flex-row overflow-hidden" style={{ borderColor: LINE, height: "560px" }}>
        <div className="md:w-56 shrink-0 border-b md:border-b-0 md:border-r overflow-x-auto md:overflow-y-auto flex md:block" style={{ borderColor: LINE }}>
          <ChannelBtn active={channel === "general"} onClick={() => setChannel("general")} label={t("general")} />
          {visibleProjects.map((p) => (
            <ChannelBtn key={p.id} active={channel === p.id} onClick={() => setChannel(p.id)} label={p.code} sub={p.name} />
          ))}
          {!isAdmin && visibleProjects.length === 0 && (
            <p className="text-[11px] text-slate-400 px-3 py-3">You're not assigned to a project channel yet — ask the admin.</p>
          )}
        </div>

        <div className="flex-1 flex flex-col min-w-0">
          <div className="flex items-center justify-between px-4 py-2 border-b" style={{ borderColor: LINE }}>
            <p className="text-xs font-semibold text-slate-500 truncate">
              {activeProject ? `${activeProject.code} · ${activeProject.name}` : t("general")}
            </p>
            <button onClick={startCall} className="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg shrink-0" style={{ background: PAPER, color: NAVY }}>
              <Video size={13} /> {t("startCall")}
            </button>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {filtered.length === 0 && <EmptyHint text={t("noMessagesYet")} />}
            {filtered.map((m) => {
              const mine = m.authorId === identity.id;
              const author = mine ? identity : team.find((t) => t.id === m.authorId);
              const att = m.attachment;
              const isImg = att && att.mimeType && att.mimeType.startsWith("image/");
              const isEditing = editingId === m.id;
              const menuOpen = menuOpenId === m.id;

              if (m.deleted) {
                return (
                  <div key={m.id} className={`flex gap-2 ${mine ? "flex-row-reverse" : ""}`}>
                    <Avatar name={authorName(team, m.authorId, identity)} initials={author && author.initials} size={26} />
                    <div className={`max-w-[75%] ${mine ? "items-end" : "items-start"} flex flex-col`}>
                      <div className="rounded-2xl px-3 py-2 text-sm italic text-slate-400" style={{ background: PAPER }}>{t("deletedMessage")}</div>
                      <p className="text-[10px] text-slate-400 mt-0.5 px-1">{authorName(team, m.authorId, identity)} · {fmtDateTime(m.createdAt)}</p>
                    </div>
                  </div>
                );
              }

              return (
                <div key={m.id} className={`flex gap-2 group ${mine ? "flex-row-reverse" : ""}`}>
                  <Avatar name={authorName(team, m.authorId, identity)} initials={author && author.initials} size={26} />
                  <div className={`max-w-[75%] ${mine ? "items-end" : "items-start"} flex flex-col relative`}>
                    {m.forwardedFrom && (
                      <p className="text-[10px] text-slate-400 flex items-center gap-1 px-1"><ForwardIcon size={10} /> {t("forwardedFrom")} {m.forwardedFrom}</p>
                    )}
                    {m.replyTo && (
                      <div className="text-[11px] px-2.5 py-1.5 rounded-lg mb-1 border-l-2" style={{ background: PAPER, borderColor: GOLD, maxWidth: "220px" }}>
                        <p className="font-semibold" style={{ color: NAVY }}>{m.replyTo.authorName}</p>
                        <p className="truncate text-slate-500">{m.replyTo.text}</p>
                      </div>
                    )}
                    {att && (
                      isImg ? (
                        imgCache[att.id] ? (
                          <img src={imgCache[att.id]} onClick={() => viewAttachment(att)}
                            className="rounded-xl max-w-full max-h-56 object-cover cursor-pointer mb-1" alt={att.name} />
                        ) : (
                          <div className="rounded-xl w-40 h-28 flex items-center justify-center mb-1" style={{ background: PAPER }}>
                            <div className="w-5 h-5 rounded-full border-2 animate-spin" style={{ borderColor: LINE, borderTopColor: NAVY }} />
                          </div>
                        )
                      ) : (
                        <div className="flex items-center gap-2 p-2 rounded-xl text-xs mb-1" style={{ background: PAPER }}>
                          <button onClick={() => viewAttachment(att)} className="flex items-center gap-2 flex-1 min-w-0 text-left">
                            <FileIcon size={14} className="text-slate-400 shrink-0" />
                            <span className="truncate max-w-[120px]">{att.name}</span>
                          </button>
                          <button onClick={() => downloadAttachment(att)} className="text-slate-400 hover:text-slate-700 shrink-0">
                            <Download size={12} />
                          </button>
                        </div>
                      )
                    )}

                    {isEditing ? (
                      <div className="flex items-center gap-1.5 w-full">
                        <input autoFocus value={editText} onChange={(e) => setEditText(e.target.value)}
                          onKeyDown={(e) => { if (e.key === "Enter") saveEdit(m); if (e.key === "Escape") setEditingId(null); }}
                          className="input flex-1 text-sm" />
                        <button onClick={() => saveEdit(m)} className="text-xs font-medium px-2 py-1.5 rounded-lg text-white shrink-0" style={{ background: NAVY }}>{t("save")}</button>
                        <button onClick={() => setEditingId(null)} className="text-xs text-slate-400 shrink-0">{t("cancel")}</button>
                      </div>
                    ) : (
                      m.text && (
                        <div className="rounded-2xl px-3 py-2 text-sm" style={mine ? { background: NAVY, color: "white" } : { background: PAPER }}>
                          {renderMentionText(m.text, team)}
                        </div>
                      )
                    )}

                    <div className="flex items-center gap-1.5 mt-0.5 px-1">
                      <p className="text-[10px] text-slate-400">
                        {authorName(team, m.authorId, identity)} · {fmtDateTime(m.createdAt)}{m.editedAt ? ` · ${t("edited")}` : ""}
                      </p>
                      <button onClick={() => setMenuOpenId(menuOpen ? null : m.id)} className="text-slate-300 hover:text-slate-600 md:opacity-0 md:group-hover:opacity-100 transition">
                        <MoreIcon size={12} />
                      </button>
                    </div>

                    {menuOpen && (
                      <>
                        <div className="fixed inset-0 z-40" onClick={() => setMenuOpenId(null)} />
                        <div className={`absolute top-6 ${mine ? "right-0" : "left-0"} bg-white rounded-lg shadow-xl border py-1 w-32 z-50`} style={{ borderColor: LINE }}>
                          <button onClick={() => { setReplyingTo(m); setMenuOpenId(null); }} className="w-full flex items-center gap-2 px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50 text-left">
                            <ReplyIcon size={12} /> {t("reply")}
                          </button>
                          <button onClick={() => { setForwardingMsg(m); setMenuOpenId(null); }} className="w-full flex items-center gap-2 px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50 text-left">
                            <ForwardIcon size={12} /> {t("forward")}
                          </button>
                          {canEditMsg(m) && !att && (
                            <button onClick={() => { setEditingId(m.id); setEditText(m.text || ""); setMenuOpenId(null); }} className="w-full flex items-center gap-2 px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50 text-left">
                              <PencilIcon size={12} /> {t("edit")}
                            </button>
                          )}
                          {canDeleteMsg(m) && (
                            <button onClick={() => deleteMsg(m)} className="w-full flex items-center gap-2 px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 text-left">
                              <Trash2 size={12} /> {t("delete")}
                            </button>
                          )}
                        </div>
                      </>
                    )}
                  </div>
                </div>
              );
            })}
            <div ref={endRef} />
          </div>
          {uploadError && <p className="text-xs text-red-600 px-3 pb-1">{uploadError}</p>}
          {replyingTo && (
            <div className="flex items-center justify-between px-3 py-1.5 border-t text-xs" style={{ borderColor: LINE, background: PAPER }}>
              <div className="flex items-center gap-1.5 min-w-0">
                <ReplyIcon size={12} className="text-slate-400 shrink-0" />
                <span className="text-slate-400 shrink-0">{t("replyingTo")}</span>
                <span className="font-medium truncate">{authorName(team, replyingTo.authorId, identity)}: {replyingTo.text || (replyingTo.attachment ? replyingTo.attachment.name : "")}</span>
              </div>
              <button onClick={() => setReplyingTo(null)} className="text-slate-400 hover:text-slate-700 shrink-0"><X size={13} /></button>
            </div>
          )}
          {mentionMatches.length > 0 && (
            <div className="mx-3 mb-1 bg-white border rounded-lg shadow-lg overflow-hidden" style={{ borderColor: LINE }}>
              {mentionMatches.map((m) => (
                <button key={m.id} onClick={() => selectMention(m)} className="w-full flex items-center gap-2 px-3 py-2 text-xs hover:bg-slate-50 text-left">
                  <Avatar name={m.name} initials={m.initials} size={20} />
                  <span className="font-medium">{m.name}</span>
                  <span className="text-slate-400">{m.role}</span>
                </button>
              ))}
            </div>
          )}
          <div className="p-3 border-t flex gap-2" style={{ borderColor: LINE }}>
            <input ref={fileInputRef} type="file" onChange={handleFile} className="hidden" />
            <button onClick={pickFile} disabled={uploading} className="px-2.5 rounded-lg shrink-0 disabled:opacity-50" style={{ background: PAPER, color: NAVY }} title="Attach a screenshot or file">
              <Paperclip size={15} />
            </button>
            <input ref={textInputRef} value={text} onChange={(e) => handleTextChange(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && mentionMatches.length === 0) send(); if (e.key === "Escape") setMentionQuery(null); }}
              onPaste={handlePaste}
              placeholder={uploading ? "Uploading…" : `Message ${channel === "general" ? "the team" : "this project"}… (@ to mention, paste a screenshot)`} className="input flex-1" />
            <button onClick={send} className="px-3 rounded-lg text-white shrink-0" style={{ background: NAVY }}><Send size={15} /></button>
          </div>
        </div>
      </div>

      {forwardingMsg && (
        <Modal title={t("forwardTo")} onClose={() => setForwardingMsg(null)}>
          <div className="space-y-1.5">
            <button onClick={() => doForward("general")} className="w-full flex items-center gap-2 p-2.5 rounded-lg border hover:border-slate-400 text-left text-sm" style={{ borderColor: LINE }}>
              {t("general")}
            </button>
            {visibleProjects.map((p) => (
              <button key={p.id} onClick={() => doForward(p.id)} className="w-full flex items-center gap-2 p-2.5 rounded-lg border hover:border-slate-400 text-left" style={{ borderColor: LINE }}>
                <span className="text-xs font-mono font-semibold" style={{ color: NAVY }}>{p.code}</span>
                <span className="text-sm truncate">{p.name}</span>
              </button>
            ))}
          </div>
        </Modal>
      )}

      <p className="text-[11px] text-slate-400">
        {callLink
          ? "\"Start Call\" opens the team's call link and alerts everyone with the dashboard open right now — it won't ring phones like a normal call."
          : "No call link set yet — ask the admin to add one in Settings."}
      </p>
    </div>
  );
}

        background: active ? PAPER : "white",

// ---------------------------------------------------------------------------
// Reports — weekly-style portfolio report, exportable to Excel or PDF (print)
// ---------------------------------------------------------------------------
function Reports({ data }) {
  const { t } = useLang();
  const { projects, team, tasks } = data;
  const generatedAt = new Date();

  const projectRows = projects.map((p) => {
    const pTasks = tasks.filter((t) => t.projectId === p.id);
    const done = pTasks.filter((t) => t.status === "done").length;
    const overdue = pTasks.filter((t) => t.dueDate && t.status !== "done" && new Date(t.dueDate) < new Date()).length;
    return {
      code: p.code, name: p.name, total: pTasks.length, done,
      pct: pTasks.length ? Math.round((done / pTasks.length) * 100) : 0, overdue,
      health: projectHealth(p, tasks),
    };
  });

  const teamRows = team.map((m) => {
    const mTasks = tasks.filter((t) => t.assigneeId === m.id);
    const open = mTasks.filter((t) => t.status !== "done").length;
    const overdue = mTasks.filter((t) => t.dueDate && t.status !== "done" && new Date(t.dueDate) < new Date()).length;
    return { name: m.name, initials: m.initials || "", role: m.role, open, overdue };
  });

  const overdueTasks = tasks
    .filter((t) => t.dueDate && t.status !== "done" && new Date(t.dueDate) < new Date())
    .map((t) => ({
      project: projectLabel(projects, t.projectId),
      title: t.title,
      assignee: (team.find((m) => m.id === t.assigneeId) || {}).name || "Unassigned",
      due: fmtDate(t.dueDate),
    }));

  const exportExcel = () => {
    if (!window.XLSX) return;
    const X = window.XLSX;
    const NAVY_HEX = "FF002E62";
    const RED_HEX = "FFB42318";
    const TEAL_HEX = "FF006450";
    const GREY_HEX = "FFF6F5F2";

    const titleStyle = { font: { bold: true, sz: 16, color: { rgb: "FF002E62" } } };
    const subStyle = { font: { italic: true, sz: 10, color: { rgb: "FF64748B" } } };
    const headerStyle = {
      font: { bold: true, color: { rgb: "FFFFFFFF" }, sz: 10 },
      fill: { fgColor: { rgb: NAVY_HEX } },
      alignment: { horizontal: "center", vertical: "center" },
    };
    const bodyStyle = (alt) => ({
      border: { bottom: { style: "thin", color: { rgb: "FFE4E1D8" } } },
      alignment: { vertical: "center" },
      ...(alt ? { fill: { fgColor: { rgb: GREY_HEX } } } : {}),
    });
    const rightStyle = (alt) => ({ ...bodyStyle(alt), alignment: { vertical: "center", horizontal: "right" } });
    const redStyle = (alt) => ({ ...rightStyle(alt), font: { bold: true, color: { rgb: RED_HEX } } });
    const tealStyle = (alt) => ({ ...rightStyle(alt), font: { bold: true, color: { rgb: TEAL_HEX } } });

    const cell = (v, s) => (s ? { v, s } : { v });

    const buildSheet = (title, headers, styledRows, colWidths) => {
      const aoa = [];
      aoa.push([cell(title, titleStyle)]);
      aoa.push([cell(`Generated ${generatedAt.toLocaleString()}`, subStyle)]);
      aoa.push([]);
      aoa.push(headers.map((h) => cell(h, headerStyle)));
      styledRows.forEach((row) => aoa.push(row));
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = colWidths.map((w) => ({ wch: w }));
      ws["!merges"] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: headers.length - 1 } },
        { s: { r: 1, c: 0 }, e: { r: 1, c: headers.length - 1 } },
      ];
      ws["!rows"] = [{ hpt: 22 }, { hpt: 16 }, { hpt: 6 }, { hpt: 20 }];
      return ws;
    };

    const wb = X.utils.book_new();

    const projectStyledRows = projectRows.map((r, i) => {
      const alt = i % 2 === 1;
      const healthStyle = r.health.level === "critical" ? redStyle(alt) : r.health.level === "attention" ? { ...bodyStyle(alt), font: { bold: true, color: { rgb: "FFB5730A" } } } : r.health.level === "healthy" ? tealStyle(alt) : bodyStyle(alt);
      return [
        cell(r.code, bodyStyle(alt)),
        cell(r.name, bodyStyle(alt)),
        cell(r.health.level === "none" ? "—" : r.health.label, healthStyle),
        cell(r.total, rightStyle(alt)),
        cell(r.done, rightStyle(alt)),
        cell(r.pct + "%", r.pct === 100 ? tealStyle(alt) : rightStyle(alt)),
        cell(r.overdue, r.overdue > 0 ? redStyle(alt) : rightStyle(alt)),
      ];
    });
    const wsProjects = buildSheet(
      "ROSHN Portfolio Report — Project Progress",
      ["Code", "Project", "Health", "Total Tasks", "Done", "% Complete", "Overdue"],
      projectStyledRows, [10, 42, 14, 12, 10, 12, 10]
    );
    X.utils.book_append_sheet(wb, wsProjects, "Projects");

    const teamStyledRows = teamRows.map((r, i) => {
      const alt = i % 2 === 1;
      return [
        cell(r.initials, bodyStyle(alt)),
        cell(r.name, bodyStyle(alt)),
        cell(r.role, bodyStyle(alt)),
        cell(r.open, rightStyle(alt)),
        cell(r.overdue, r.overdue > 0 ? redStyle(alt) : rightStyle(alt)),
      ];
    });
    const wsTeam = buildSheet(
      "ROSHN Portfolio Report — Team Workload",
      ["Initials", "Name", "Role", "Open Tasks", "Overdue"],
      teamStyledRows, [10, 24, 26, 12, 10]
    );
    X.utils.book_append_sheet(wb, wsTeam, "Team Workload");

    const overdueStyledRows = overdueTasks.map((r, i) => {
      const alt = i % 2 === 1;
      return [
        cell(r.project, bodyStyle(alt)),
        cell(r.title, bodyStyle(alt)),
        cell(r.assignee, bodyStyle(alt)),
        cell(r.due, { ...rightStyle(alt), font: { bold: true, color: { rgb: RED_HEX } } }),
      ];
    });
    const wsOverdue = buildSheet(
      "ROSHN Portfolio Report — Overdue Tasks",
      ["Project", "Task", "Assignee", "Due Date"],
      overdueStyledRows, [30, 36, 22, 14]
    );
    X.utils.book_append_sheet(wb, wsOverdue, "Overdue Tasks");

    const stamp = generatedAt.toISOString().slice(0, 10);
    X.writeFile(wb, `ROSHN_Portfolio_Report_${stamp}.xlsx`);
  };

  const printPdf = () => window.print();

  return (
    <div className="space-y-5 print-area">
      <div className="flex flex-wrap items-center justify-between gap-3 no-print">
        <div>
          <h1 className="text-xl font-bold" style={{ color: NAVY }}>{t("navReports")}</h1>
          <p className="text-sm text-slate-500 mt-0.5">{t("reportsSubtitle")}</p>
        </div>
        <div className="flex gap-2">
          <button onClick={exportExcel} className="flex items-center gap-1.5 text-sm font-medium text-white px-3 py-2 rounded-lg" style={{ background: NAVY }}>
            <Download size={15} /> {t("exportExcel")}
          </button>
          <button onClick={printPdf} className="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg border" style={{ borderColor: LINE }}>
            <Printer size={15} /> {t("printPdf")}
          </button>
        </div>
      </div>

      <div className="hidden print:block mb-4">
        <h1 className="text-xl font-bold" style={{ color: NAVY }}>ROSHN Portfolio Report</h1>
        <p className="text-xs text-slate-500">Generated {generatedAt.toLocaleString()}</p>
      </div>

      <div className="bg-white rounded-xl border p-4" style={{ borderColor: LINE }}>
        <h2 className="text-sm font-semibold mb-3" style={{ color: NAVY }}>{t("projectProgress")}</h2>
        <table className="w-full text-xs">
          <thead>
            <tr className="text-left text-slate-400 border-b" style={{ borderColor: LINE }}>
              <th className="py-1.5 font-medium">Code</th><th className="font-medium">Project</th>
              <th className="font-medium">Health</th>
              <th className="font-medium text-right">Tasks</th><th className="font-medium text-right">Done</th>
              <th className="font-medium text-right">%</th><th className="font-medium text-right">Overdue</th>
            </tr>
          </thead>
          <tbody>
            {projectRows.map((r, i) => (
              <tr key={i} className="border-b" style={{ borderColor: LINE }}>
                <td className="py-1.5 font-mono">{r.code}</td><td>{r.name}</td>
                <td>
                  {r.health.level !== "none" && (
                    <span className="flex items-center gap-1" style={{ color: r.health.color }}>
                      <span className="w-1.5 h-1.5 rounded-full" style={{ background: r.health.dot }} />
                      {r.health.label}
                    </span>
                  )}
                </td>
                <td className="text-right">{r.total}</td><td className="text-right">{r.done}</td>
                <td className="text-right font-medium" style={{ color: r.pct === 100 ? TEAL : INK }}>{r.pct}%</td>
                <td className="text-right" style={{ color: r.overdue > 0 ? "#B42318" : INK }}>{r.overdue}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="bg-white rounded-xl border p-4" style={{ borderColor: LINE }}>
        <h2 className="text-sm font-semibold mb-3" style={{ color: NAVY }}>Team Workload</h2>
        <table className="w-full text-xs">
          <thead>
            <tr className="text-left text-slate-400 border-b" style={{ borderColor: LINE }}>
              <th className="py-1.5 font-medium">Initials</th><th className="font-medium">Name</th><th className="font-medium">Role</th>
              <th className="font-medium text-right">Open</th><th className="font-medium text-right">Overdue</th>
            </tr>
          </thead>
          <tbody>
            {teamRows.map((r, i) => (
              <tr key={i} className="border-b" style={{ borderColor: LINE }}>
                <td className="py-1.5 font-mono">{r.initials}</td><td>{r.name}</td><td className="text-slate-500">{r.role}</td>
                <td className="text-right">{r.open}</td>
                <td className="text-right" style={{ color: r.overdue > 0 ? "#B42318" : INK }}>{r.overdue}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="bg-white rounded-xl border p-4" style={{ borderColor: LINE }}>
        <h2 className="text-sm font-semibold mb-3" style={{ color: "#B42318" }}>Overdue Tasks ({overdueTasks.length})</h2>
        {overdueTasks.length === 0 ? (
          <EmptyHint text="Nothing overdue right now." />
        ) : (
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-400 border-b" style={{ borderColor: LINE }}>
                <th className="py-1.5 font-medium">Project</th><th className="font-medium">Task</th>
                <th className="font-medium">Assignee</th><th className="font-medium text-right">Due</th>
              </tr>
            </thead>
            <tbody>
              {overdueTasks.map((r, i) => (
                <tr key={i} className="border-b" style={{ borderColor: LINE }}>
                  <td className="py-1.5">{r.project}</td><td>{r.title}</td><td>{r.assignee}</td>
                  <td className="text-right" style={{ color: "#B42318" }}>{r.due}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Shared UI bits
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// CallOverlay — native 1-to-1 WebRTC call UI (incoming / outgoing / active)
// ---------------------------------------------------------------------------
function CallOverlay({ incomingCall, callPhase, callPeerName, callError, micOn, camOn, localHasVideo, remoteHasVideo, callDiag, audioBlocked, onResumeAudio, localVideoRef, remoteVideoRef, remoteAudioRef, onAccept, onDecline, onHangUp, onToggleMic, onToggleCam, onDismissError }) {
  if (callError) {
    return (
      <div className="fixed inset-0 z-[80] flex items-center justify-center px-4" style={{ background: "rgba(0,0,0,0.6)" }}>
        <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full text-center">
          <PhoneOff size={28} className="mx-auto mb-2 text-red-500" />
          <p className="text-sm text-slate-700 mb-4">{callError}</p>
          <button onClick={onDismissError} className="px-4 py-2 rounded-lg text-white text-sm font-medium" style={{ background: NAVY }}>OK</button>
        </div>
      </div>
    );
  }

  if (incomingCall && callPhase === "idle") {
    return (
      <div className="fixed inset-0 z-[80] flex items-center justify-center px-4" style={{ background: "rgba(0,0,0,0.7)" }}>
        <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full text-center">
          <div className="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center animate-pulse" style={{ background: TEAL }}>
            <PhoneCall size={26} className="text-white" />
          </div>
          <p className="text-xs text-slate-400 mb-1">Incoming call</p>
          <p className="text-lg font-semibold mb-6" style={{ color: NAVY }}>{incomingCall.callerName}</p>
          <div className="flex items-center justify-center gap-4">
            <button onClick={onDecline} className="w-14 h-14 rounded-full flex items-center justify-center text-white" style={{ background: "#B42318" }}>
              <PhoneOff size={22} />
            </button>
            <button onClick={onAccept} className="w-14 h-14 rounded-full flex items-center justify-center text-white" style={{ background: TEAL }}>
              <PhoneCall size={22} />
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (callPhase === "outgoing") {
    return (
      <div className="fixed inset-0 z-[80] flex items-center justify-center px-4" style={{ background: "rgba(0,0,0,0.7)" }}>
        <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full text-center">
          <div className="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center animate-pulse" style={{ background: NAVY }}>
            <PhoneCall size={26} className="text-white" />
          </div>
          <p className="text-xs text-slate-400 mb-1">Calling…</p>
          <p className="text-lg font-semibold mb-6" style={{ color: NAVY }}>{callPeerName}</p>
          <button onClick={onHangUp} className="w-14 h-14 rounded-full flex items-center justify-center text-white mx-auto" style={{ background: "#B42318" }}>
            <PhoneOff size={22} />
          </button>
        </div>
      </div>
    );
  }

  if (callPhase === "active") {
    return (
      <div className="fixed inset-0 z-[80] flex flex-col" style={{ background: "#0B1220" }}>
        <audio ref={remoteAudioRef} autoPlay />
        <div className="flex-1 relative">
          <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-cover" style={{ display: remoteHasVideo ? "block" : "none" }} />
          {!remoteHasVideo && (
            <div className="w-full h-full flex flex-col items-center justify-center gap-3">
              <div className="w-20 h-20 rounded-full flex items-center justify-center text-white text-2xl font-semibold" style={{ background: NAVY }}>
                {(callPeerName || "?").split(" ").filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("")}
              </div>
              <p className="text-white/60 text-xs">Audio only</p>
            </div>
          )}
          <div className="absolute top-4 left-4 text-white text-sm font-medium bg-black/40 px-3 py-1.5 rounded-lg">{callPeerName}</div>
          {callDiag && (
            <pre className="absolute top-4 right-4 text-white text-[9px] leading-tight bg-black/60 px-2 py-1.5 rounded-lg max-w-[260px] whitespace-pre-wrap font-mono">{callDiag}</pre>
          )}
          {audioBlocked && (
            <button onClick={onResumeAudio} className="absolute inset-0 flex flex-col items-center justify-center gap-3" style={{ background: "rgba(0,0,0,0.75)" }}>
              <div className="w-16 h-16 rounded-full flex items-center justify-center animate-pulse" style={{ background: GOLD }}>
                <Volume2 size={26} className="text-white" />
              </div>
              <p className="text-white text-sm font-semibold">Tap to enable sound</p>
              <p className="text-white/60 text-xs max-w-[220px] text-center">Your browser blocked audio from starting automatically</p>
            </button>
          )}
          {localHasVideo ? (
            <video ref={localVideoRef} autoPlay playsInline muted className="absolute bottom-4 right-4 w-28 h-36 sm:w-36 sm:h-48 object-cover rounded-xl border-2 border-white/20" />
          ) : (
            <div className="absolute bottom-4 right-4 w-28 h-20 sm:w-36 sm:h-24 rounded-xl border-2 border-white/20 flex items-center justify-center" style={{ background: "#1E293B" }}>
              <p className="text-white/50 text-[10px]">No camera</p>
            </div>
          )}
        </div>
        <div className="flex items-center justify-center gap-4 py-5" style={{ background: "#0B1220" }}>
          <button onClick={onToggleMic} className="w-12 h-12 rounded-full flex items-center justify-center" style={{ background: micOn ? "#1E293B" : "#B42318", color: "white" }}>
            {micOn ? <Mic size={18} /> : <MicOff size={18} />}
          </button>
          <button onClick={onHangUp} className="w-14 h-14 rounded-full flex items-center justify-center text-white" style={{ background: "#B42318" }}>
            <PhoneOff size={22} />
          </button>
          <button onClick={onToggleCam} disabled={!localHasVideo} className="w-12 h-12 rounded-full flex items-center justify-center disabled:opacity-30" style={{ background: camOn ? "#1E293B" : "#B42318", color: "white" }}>
            {camOn ? <Video size={18} /> : <VideoOff size={18} />}
          </button>
        </div>
      </div>
    );
  }

  return null;
}

function Modal({ title, children, onClose, wide }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className={`bg-white rounded-2xl shadow-2xl w-full ${wide ? "max-w-lg" : "max-w-sm"} max-h-[85vh] overflow-y-auto`}>
        <div className="flex items-center justify-between px-5 py-4 border-b sticky top-0 bg-white" style={{ borderColor: LINE }}>
          <h2 className="text-sm font-semibold" style={{ color: NAVY }}>{title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><X size={18} /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div>
      <label className="text-xs font-medium text-slate-500 block mb-1">{label}</label>
      {children}
    </div>
  );
}

// inject minimal input styling once
const styleTag = typeof document !== "undefined" ? document.getElementById("roshn-dash-style") : null;
if (typeof document !== "undefined" && !styleTag) {
  const s = document.createElement("style");
  s.id = "roshn-dash-style";
  s.innerHTML = `.input{width:100%;border:1px solid ${LINE};border-radius:0.5rem;padding:0.5rem 0.7rem;font-size:0.82rem;outline:none;background:white;} .input:focus{border-color:${NAVY};box-shadow:0 0 0 2px ${NAVY}22;} @media (max-width:768px){.input{font-size:16px;}}`;
  document.head.appendChild(s);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
